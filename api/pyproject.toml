[project]
name = "apartment-ultra-backend"
version = "0.1.0"
description = "Apartment management system backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "reportlab>=4.0.8",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.0",
    "python-slugify>=8.0.1",
    "ulid>=1.1",
    "apscheduler>=3.10.0",
    "wechatpayv3>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.14.0",
    "mypy>=1.17.0",
    "types-python-jose>=3.3.0",
]

[tool.uv]
package = false

[tool.setuptools]
packages = []

# ==================================================================
# MyPy Configuration
# ==================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "migrations/",
    "tests/",
]

# ==================================================================
# Pytest Configuration
# ==================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
