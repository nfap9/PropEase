<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>寓管家 - 登录</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: white; }
    </style>
</head>
<body>
<div class="app-container">
<!-- 状态栏 -->
<div class="px-6 py-4 flex justify-between items-center text-xs font-medium bg-white/80 backdrop-blur-md">
<span id="current-time-display">09:41</span>
<div class="flex space-x-1 border-gray-400">
<span class="iconify text-lg" data-icon="material-symbols:signal-cellular-4-bar"></span>
<span class="iconify text-lg" data-icon="material-symbols:wifi-rounded"></span>
<span class="iconify text-lg" data-icon="material-symbols:battery-5-bar"></span>
</div>
</div>
<div class="px-8 mt-12 overflow-y-auto max-h-[700px] no-scrollbar">
<!-- Logo Section -->
<div class="mb-12 flex flex-col items-center">
<div class="w-20 h-20 bg-gradient-to-tr from-blue-700 to-blue-500 rounded-3xl flex items-center justify-center shadow-2xl shadow-blue-200 mb-4 transform rotate-3">
<span class="iconify text-white text-5xl" data-icon="material-symbols:domain-rounded"></span>
</div>
<h1 class="text-3xl font-black text-gray-800 tracking-tight">寓管家</h1>
<p class="text-gray-400 text-xs mt-2 font-medium tracking-wide">AI 驱动的智能化公寓租赁管理系统</p>
<div class="mt-2 px-3 py-1 bg-blue-50 text-blue-600 text-[10px] rounded-full font-bold">2026.03.10 版本</div>
</div>
<!-- Login Form -->
<div class="space-y-6" id="authContainer">
<!-- Tab -->
<div class="flex p-1 bg-gray-100 rounded-xl mb-8">
<button class="flex-1 py-2 text-sm font-bold rounded-lg transition-all bg-white text-blue-600 shadow-sm" id="tab-login" onclick="switchAuthMode('login')">登录</button>
<button class="flex-1 py-2 text-sm font-bold rounded-lg transition-all text-gray-500" id="tab-register" onclick="switchAuthMode('register')">注册</button>
</div>
<div class="space-y-4" id="formFields">
<div class="relative group">
<span class="iconify absolute left-4 top-4 text-gray-400 group-focus-within:text-blue-500 transition-colors" data-icon="material-symbols:smartphone-rounded"></span>
<input class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-50/50 transition-all outline-none text-sm" id="user-phone" placeholder="请输入手机号" type="tel" value="13800138000"/>
</div>
<div class="relative group" id="pwd-field">
<span class="iconify absolute left-4 top-4 text-gray-400 group-focus-within:text-blue-500 transition-colors" data-icon="material-symbols:lock-outline-rounded"></span>
<input class="w-full pl-12 pr-4 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-50/50 transition-all outline-none text-sm" id="user-pwd" placeholder="请输入密码" type="password" value="123456"/>
</div>
<div class="hidden relative group" id="code-field">
<span class="iconify absolute left-4 top-4 text-gray-400" data-icon="material-symbols:shield-outline"></span>
<input class="w-full pl-12 pr-28 py-4 bg-gray-50 border border-gray-100 rounded-2xl focus:bg-white focus:border-blue-500 transition-all outline-none text-sm" placeholder="短信验证码" type="text"/>
<button class="absolute right-3 top-2.5 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold">获取验证码</button>
</div>
</div>
<div class="flex justify-between items-center text-xs px-1">
<label class="flex items-center text-gray-400 font-medium">
<input checked="" class="mr-2 w-4 h-4 rounded-md border-gray-200 text-blue-600 focus:ring-blue-500" type="checkbox"/> 自动登录
                    </label>
<a class="text-blue-600 font-bold" href="javascript:void(0)">忘记密码？</a>
</div>
<button class="w-full py-4 bg-blue-600 text-white text-center rounded-2xl font-bold text-base shadow-xl shadow-blue-200 hover:shadow-blue-300 active:scale-[0.98] transition-all flex items-center justify-center space-x-2" onclick="handleAuth()">
<span id="btn-text">立即登录</span>
<span class="iconify" data-icon="material-symbols:arrow-forward-rounded"></span>
</button>
<!-- Feedback Toast (Simulated) -->
<div class="fixed top-12 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-sm font-medium shadow-2xl opacity-0 transition-opacity pointer-events-none z-50" id="toast">
                    账号或密码错误
                </div>
</div>
<!-- Third Party -->
<div class="mt-16 pb-20">
<div class="flex items-center space-x-4 mb-8">
<div class="flex-1 h-px bg-gray-100"></div>
<span class="text-gray-300 text-[10px] uppercase font-bold tracking-widest">快捷登录方式</span>
<div class="flex-1 h-px bg-gray-100"></div>
</div>
<div class="flex justify-center space-x-10">
<button class="w-14 h-14 bg-white border border-gray-100 rounded-2xl flex items-center justify-center text-[#07C160] shadow-sm hover:shadow-md transition-shadow">
<span class="iconify text-3xl" data-icon="ri:wechat-fill"></span>
</button>
<button class="w-14 h-14 bg-white border border-gray-100 rounded-2xl flex items-center justify-center text-gray-900 shadow-sm hover:shadow-md transition-shadow">
<span class="iconify text-2xl" data-icon="logos:apple"></span>
</button>
<button class="w-14 h-14 bg-white border border-gray-100 rounded-2xl flex items-center justify-center text-blue-500 shadow-sm hover:shadow-md transition-shadow">
<span class="iconify text-3xl" data-icon="logos:google-icon"></span>
</button>
</div>
</div>
<div class="py-8 text-center">
<p class="text-[10px] text-gray-400 leading-relaxed max-w-xs mx-auto">
                    登录即代表您同意 <span class="text-blue-500 font-bold underline">服务协议</span> 与 <span class="text-blue-500 font-bold underline">隐私政策</span><br/>
                    © 2026 寓管家 Pro. 保留所有权利
                </p>
</div>
</div>
</div>
<script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time-display').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        let currentMode = 'login';
        
        function switchAuthMode(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const btnText = document.getElementById('btn-text');
            const pwdField = document.getElementById('pwd-field');
            
            if(mode === 'login') {
                tabLogin.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
                tabLogin.classList.remove('text-gray-500');
                tabRegister.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
                tabRegister.classList.add('text-gray-500');
                btnText.innerText = '立即登录';
                pwdField.classList.remove('hidden');
            } else {
                tabRegister.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
                tabRegister.classList.remove('text-gray-500');
                tabLogin.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
                tabLogin.classList.add('text-gray-500');
                btnText.innerText = '完成注册';
                // 模拟可以显示更多注册字段
            }
        }

        function handleAuth() {
            const phone = document.getElementById('user-phone').value;
            const toast = document.getElementById('toast');
            
            if(!phone || phone.length < 11) {
                showToast('请输入有效的手机号');
                return;
            }

            // 成功模拟跳转
            window.location.href = 'dashboard.html';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>


</html>
