<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>水电账单 - 云寓 CloudApart</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>
<body class="bg-[#f4f7fa] min-h-screen">
<div class="flex">
<!-- 侧边栏 (复用) -->
<aside class="w-64 bg-slate-900 h-screen fixed">
<div class="p-6 flex items-center gap-2 text-white">
<span class="iconify text-3xl text-indigo-400" data-icon="solar:home-smile-bold-duotone"></span>
<span class="text-xl font-bold tracking-tight">云寓管理</span>
</div>
<nav class="mt-6 px-4 space-y-2">
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="dashboard.html">
<span class="iconify text-xl" data-icon="solar:widget-bold"></span>
<span>控制台首页</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="organization.html">
<span class="iconify text-xl" data-icon="solar:users-group-rounded-bold"></span>
<span>组织管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="apartment.html">
<span class="iconify text-xl" data-icon="solar:buildings-bold"></span>
<span>公寓管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="room.html">
<span class="iconify text-xl" data-icon="solar:bed-bold"></span>
<span>房间管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="lease.html">
<span class="iconify text-xl" data-icon="solar:document-add-bold"></span>
<span>租约管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 bg-indigo-600 text-white rounded-xl transition-all" href="billing.html">
<span class="iconify text-xl" data-icon="solar:bill-list-bold"></span>
<span>水电账单</span>
</a>
</nav>
</aside>
<!-- 主内容区 -->
<main class="ml-64 flex-1 p-8">
<header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
<div>
<h1 class="text-3xl font-black text-slate-800 leading-none">水电抄表与收费</h1>
<p class="text-slate-400 mt-2 font-medium">当前账期：2026年02月度账单 (2026年3月录入)</p>
</div>
<div class="flex gap-3">
<button class="bg-white border border-slate-200 px-6 py-3 rounded-2xl font-bold text-slate-600 shadow-sm hover:bg-slate-50 transition-all flex items-center gap-2">
<span class="iconify" data-icon="solar:import-bold"></span> 导入录入表
                    </button>
<button class="bg-slate-800 text-white px-8 py-3 rounded-2xl font-black shadow-lg hover:shadow-slate-200 transition-all flex items-center gap-2">
<span class="iconify" data-icon="solar:play-circle-bold text-xl"></span> 批量生成账单
                    </button>
</div>
</header>
<!-- 状态汇总 -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
<div class="bg-indigo-600 rounded-[2rem] p-8 text-white relative overflow-hidden group shadow-xl shadow-indigo-100">
<div class="relative z-10">
<div class="text-indigo-200 text-xs font-black uppercase tracking-widest mb-2">已预收水电款</div>
<div class="text-4xl font-black">￥42,350.00</div>
<div class="mt-4 flex items-center gap-2 bg-white/10 w-max px-3 py-1 rounded-full text-[10px] font-bold">
<span class="iconify" data-icon="solar:check-circle-bold"></span> 102个房间已录入
                        </div>
</div>
<span class="iconify absolute top-[-20%] right-[-10%] text-[150px] text-white/10 rotate-12 transition-transform group-hover:scale-110" data-icon="solar:lightning-bold"></span>
</div>
<div class="bg-white rounded-[2rem] p-8 border border-slate-100 shadow-sm flex flex-col justify-between">
<div>
<div class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1">待录入读数</div>
<div class="text-4xl font-black text-slate-800">26 <span class="text-sm font-normal text-slate-400">间房</span></div>
</div>
<div class="mt-4 h-1.5 w-full bg-slate-100 rounded-full">
<div class="bg-orange-500 h-full w-[20%] rounded-full"></div>
</div>
</div>
<div class="bg-white rounded-[2rem] p-8 border border-slate-100 shadow-sm flex flex-col justify-between">
<div>
<div class="text-slate-400 text-xs font-black uppercase tracking-widest mb-1">本月总体能耗</div>
<div class="text-4xl font-black text-slate-800">8,240 <span class="text-sm font-normal text-slate-400">度 (电)</span></div>
</div>
<div class="text-green-500 text-xs font-bold mt-2">较上月下降 ↓ 5%</div>
</div>
</div>
<!-- 录入表格 -->
<div class="bg-white rounded-[32px] border border-slate-100 shadow-sm p-4 overflow-hidden">
<div class="flex items-center justify-between p-4 mb-4">
<h2 class="text-xl font-black text-slate-800">抄表录入列表</h2>
<div class="flex gap-2">
<button class="p-2.5 bg-slate-50 text-slate-400 hover:text-indigo-600 rounded-xl transition-all"><span class="iconify text-xl" data-icon="solar:filter-bold"></span></button>
<div class="relative">
<input class="pl-10 pr-4 py-2 bg-slate-50 border-none rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="房间号搜索..." type="text"/>
<span class="iconify absolute left-3 top-2.5 text-slate-400 text-lg" data-icon="solar:magnifer-linear"></span>
</div>
</div>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left">
<thead>
<tr class="text-slate-400 text-[10px] font-black uppercase tracking-widest border-b border-slate-50">
<th class="px-6 py-4">房号/租客</th>
<th class="px-6 py-4">电费上月读数</th>
<th class="px-6 py-4">电费本月读数</th>
<th class="px-6 py-4">水费上月读数</th>
<th class="px-6 py-4">水费本月读数</th>
<th class="px-6 py-4">预估金额</th>
<th class="px-6 py-4 text-center">状态</th>
<th class="px-6 py-4 text-right">操作</th>
</tr>
</thead>
<tbody class="divide-y divide-slate-50">
<!-- 行 1: 已录入 -->
<tr class="hover:bg-slate-50/50 transition-all font-medium">
<td class="px-6 py-5">
<div class="text-slate-800 font-bold">1001</div>
<div class="text-[10px] text-slate-400">赵子龙</div>
</td>
<td class="px-6 py-5 text-slate-400">1245.2</td>
<td class="px-6 py-5">
<input class="w-24 bg-indigo-50 text-indigo-700 font-black px-2 py-1 rounded-lg border-none focus:ring-2 focus:ring-indigo-500 text-center outline-none transition-all" type="text" value="1355.8"/>
</td>
<td class="px-6 py-5 text-slate-400">88.5</td>
<td class="px-6 py-5">
<input class="w-20 bg-indigo-50 text-indigo-700 font-black px-2 py-1 rounded-lg border-none focus:ring-2 focus:ring-indigo-500 text-center outline-none" type="text" value="94.2"/>
</td>
<td class="px-6 py-5">
<div class="text-slate-800 font-black">￥158.40</div>
</td>
<td class="px-6 py-5 text-center">
<span class="px-2 py-1 bg-green-50 text-green-600 text-[10px] rounded uppercase font-black tracking-widest">已保存</span>
</td>
<td class="px-6 py-5 text-right">
<button class="p-2 text-slate-300 hover:text-indigo-600"><span class="iconify" data-icon="solar:check-circle-bold"></span></button>
</td>
</tr>
<!-- 行 2: 待录入 -->
<tr class="hover:bg-slate-50/50 transition-all font-medium">
<td class="px-6 py-5">
<div class="text-slate-800 font-bold">1002</div>
<div class="text-[10px] text-slate-400">陈圆圆</div>
</td>
<td class="px-6 py-5 text-slate-400">2440.0</td>
<td class="px-6 py-5">
<input class="w-24 bg-orange-50/50 text-orange-600 font-black px-2 py-1 rounded-lg border-none focus:ring-2 focus:ring-orange-500 text-center outline-none ring-1 ring-orange-200" placeholder="录入新值" type="text"/>
</td>
<td class="px-6 py-5 text-slate-400">112.1</td>
<td class="px-6 py-5">
<input class="w-20 bg-orange-50/50 text-orange-600 font-black px-2 py-1 rounded-lg border-none focus:ring-2 focus:ring-orange-500 text-center outline-none ring-1 ring-orange-200" placeholder="录入新值" type="text"/>
</td>
<td class="px-6 py-5">
<div class="text-slate-300">计算中...</div>
</td>
<td class="px-6 py-5 text-center">
<span class="px-2 py-1 bg-orange-50 text-orange-600 text-[10px] rounded uppercase font-black tracking-widest">待抄表</span>
</td>
<td class="px-6 py-5 text-right">
<button class="bg-indigo-600 text-white text-[10px] px-3 py-1 rounded shadow-sm font-black">确认</button>
</td>
</tr>
<!-- 模拟数据 -->
<script>
                                for(let i=0; i<8; i++) {
                                    document.write(`
                                    <tr class="hover:bg-slate-50/50 transition-all">
                                        <td class="px-6 py-5">
                                            <div class="text-slate-800 font-bold">200${i+1}</div>
                                            <div class="text-[10px] text-slate-400 uppercase tracking-widest">TENANT_ID_00${i}</div>
                                        </td>
                                        <td class="px-6 py-5 text-slate-400">540.2</td>
                                        <td class="px-6 py-5"><input type="text" placeholder="..." class="w-24 bg-slate-50 border-none rounded-lg text-center py-1"></td>
                                        <td class="px-6 py-5 text-slate-400">45.0</td>
                                        <td class="px-6 py-5"><input type="text" placeholder="..." class="w-20 bg-slate-50 border-none rounded-lg text-center py-1"></td>
                                        <td class="px-6 py-5 text-slate-300">--</td>
                                        <td class="px-6 py-5 text-center">--</td>
                                        <td class="px-6 py-5 text-right opacity-20"><span class="iconify" data-icon="solar:lock-bold"></span></td>
                                    </tr>`);
                                }
                            </script>
</tbody>
</table>
</div>
</div>
</main>
</div>
</body>
</html>
