<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 公寓管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1E3A5F 0%, #2563EB 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .register-left {
            flex: 1;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            padding: 60px 48px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-left .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
        }

        .register-left .logo-icon {
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .register-left .logo-text {
            font-size: 24px;
            font-weight: 700;
        }

        .register-left h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .register-left p {
            font-size: 15px;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .register-left .benefits {
            margin-top: 24px;
        }

        .register-left .benefit-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            opacity: 0.9;
        }

        .register-left .benefit-item .icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-right {
            flex: 1;
            padding: 48px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .register-right h2 {
            font-size: 28px;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 8px;
        }

        .register-right .subtitle {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 28px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group label .required {
            color: #EF4444;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            background: #F8FAFC;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2563EB;
            background: white;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder {
            color: #94A3B8;
        }

        .form-group .hint {
            font-size: 12px;
            color: #94A3B8;
            margin-top: 6px;
        }

        .form-group.error input {
            border-color: #EF4444;
        }

        .form-group.error .hint {
            color: #EF4444;
        }

        .verification-row {
            display: flex;
            gap: 12px;
        }

        .verification-row input {
            flex: 1;
        }

        .verification-row button {
            padding: 12px 20px;
            background: #F1F5F9;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            color: #475569;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .verification-row button:hover:not(:disabled) {
            background: #E2E8F0;
        }

        .verification-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .agreement {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
        }

        .agreement input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #2563EB;
        }

        .agreement span {
            font-size: 13px;
            color: #64748B;
            line-height: 1.5;
        }

        .agreement span a {
            color: #2563EB;
            text-decoration: none;
        }

        .agreement span a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #64748B;
        }

        .login-link a {
            color: #10B981;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-left">
            <div class="logo">
                <div class="logo-icon">🏠</div>
                <div class="logo-text">公寓 Ultra</div>
            </div>
            <h1>开启智能公寓<br>管理新时代</h1>
            <p>注册账号，免费体验一站式公寓管理解决方案</p>

            <div class="benefits">
                <div class="benefit-item">
                    <div class="icon">🆓</div>
                    <span>免费注册，基础功能永久使用</span>
                </div>
                <div class="benefit-item">
                    <div class="icon">⚡</div>
                    <span>5分钟快速上手，即刻开始管理</span>
                </div>
                <div class="benefit-item">
                    <div class="icon">🔒</div>
                    <span>数据安全加密，企业级保护</span>
                </div>
                <div class="benefit-item">
                    <div class="icon">🎁</div>
                    <span>新用户专享，限时优惠活动</span>
                </div>
            </div>
        </div>

        <div class="register-right">
            <h2>创建账号</h2>
            <p class="subtitle">请填写以下信息完成注册</p>

            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label>姓名 <span class="required">*</span></label>
                        <input type="text" placeholder="请输入真实姓名">
                    </div>
                    <div class="form-group">
                        <label>手机号 <span class="required">*</span></label>
                        <input type="tel" placeholder="请输入手机号">
                    </div>
                </div>

                <div class="form-group">
                    <label>验证码 <span class="required">*</span></label>
                    <div class="verification-row">
                        <input type="text" placeholder="请输入验证码">
                        <button type="button">获取验证码</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>设置密码 <span class="required">*</span></label>
                    <input type="password" placeholder="请设置登录密码（8-20位）">
                    <p class="hint">建议使用字母、数字、符号组合</p>
                </div>

                <div class="form-group">
                    <label>确认密码 <span class="required">*</span></label>
                    <input type="password" placeholder="请再次输入密码">
                </div>

                <div class="agreement">
                    <input type="checkbox" id="agreement">
                    <span>
                        我已阅读并同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a>
                    </span>
                </div>

                <button type="submit" class="btn-primary">注 册</button>
            </form>

            <p class="login-link">
                已有账号？<a href="#">立即登录</a>
            </p>
        </div>
    </div>
</body>
</html>
