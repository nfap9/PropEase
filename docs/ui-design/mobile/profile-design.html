<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寓管家 - 我的</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        body { background-color: #f1f5f9; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: #f8fafc; }
        .app-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="app-container pb-20">
        <!-- 状态栏 -->
        <div class="px-6 py-4 flex justify-between items-center text-xs font-medium bg-white/80 backdrop-blur-md sticky top-0 z-50">
            <span id="current-time">09:41</span>
            <div class="flex space-x-1">
                <span class="iconify text-lg" data-icon="material-symbols:signal-cellular-4-bar"></span>
                <span class="iconify text-lg" data-icon="material-symbols:wifi-rounded"></span>
                <span class="iconify text-lg" data-icon="material-symbols:battery-5-bar"></span>
            </div>
        </div>

        <!-- 用户信息卡片 -->
        <div class="bg-gradient-to-br from-blue-700 to-blue-500 mx-5 mt-2 rounded-[32px] p-6 shadow-xl shadow-blue-500/20 text-white">
            <div class="flex items-center space-x-4 mb-5">
                <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center p-0.5 shadow-lg">
                    <div class="w-full h-full bg-blue-100 rounded-xl flex items-center justify-center">
                        <span class="iconify text-3xl text-blue-600" data-icon="material-symbols:person-rounded"></span>
                    </div>
                </div>
                <div>
                    <h2 class="text-lg font-black tracking-tight">管理员-老王</h2>
                    <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold uppercase tracking-widest text-blue-50">组织所有者</span>
                </div>
            </div>
            <div class="flex items-center justify-between pt-4 border-t border-white/10">
                <div class="text-center flex-1 border-r border-white/10">
                    <p class="text-lg font-black">128</p>
                    <p class="text-[9px] opacity-70 font-bold uppercase">管理房源</p>
                </div>
                <div class="text-center flex-1 border-r border-white/10">
                    <p class="text-lg font-black">4</p>
                    <p class="text-[9px] opacity-70 font-bold uppercase">团队成员</p>
                </div>
                <div class="text-center flex-1">
                    <p class="text-lg font-black text-green-300">活跃</p>
                    <p class="text-[9px] opacity-70 font-bold uppercase">组织状态</p>
                </div>
            </div>
        </div>

        <!-- 功能菜单 -->
        <div class="px-5 mt-6">
            <!-- 团队管理 -->
            <div class="space-y-2 mb-6">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest px-2 mb-3">团队管理</h3>
                <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600">
                            <span class="iconify text-xl" data-icon="material-symbols:group-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">团队成员管理</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </div>
                <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center text-purple-600">
                            <span class="iconify text-xl" data-icon="material-symbols:security-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">角色与权限配置</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </div>
            </div>

            <!-- 财务管理 -->
            <div class="space-y-2 mb-6">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest px-2 mb-3">财务管理</h3>
                <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600">
                            <span class="iconify text-xl" data-icon="material-symbols:account-balance-wallet-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">收款账户管理</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </div>
                <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-orange-50 rounded-xl flex items-center justify-center text-orange-600">
                            <span class="iconify text-xl" data-icon="material-symbols:receipt-long-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">收据模板配置</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </div>
            </div>

            <!-- 系统设置 -->
            <div class="space-y-2 mb-6">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest px-2 mb-3">系统设置</h3>
                <a href="fee-configs-design.html" class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-cyan-50 rounded-xl flex items-center justify-center text-cyan-600">
                            <span class="iconify text-xl" data-icon="material-symbols:water-drop-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">费用配置</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </a>
                <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center text-gray-600">
                            <span class="iconify text-xl" data-icon="material-symbols:notifications-outline"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">消息通知设置</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </div>
                <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center text-gray-600">
                            <span class="iconify text-xl" data-icon="material-symbols:lock-outline-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">账号与安全</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </div>
                <div class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center text-gray-600">
                            <span class="iconify text-xl" data-icon="material-symbols:help-outline-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">帮助与反馈</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </div>
                <a href="reports-design.html" class="bg-white p-4 rounded-[24px] shadow-sm flex items-center justify-between active:scale-[0.98] transition-transform">
                    <div class="flex items-center space-x-4">
                        <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600">
                            <span class="iconify text-xl" data-icon="material-symbols:analytics-rounded"></span>
                        </div>
                        <span class="text-sm font-bold text-gray-700">经营报表</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:chevron-right-rounded"></span>
                </a>
            </div>

            <!-- 组织信息 -->
            <div class="space-y-2 mb-6">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest px-2 mb-3">组织信息</h3>
                <div class="bg-white p-5 rounded-[24px] shadow-sm space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-400 font-bold">目前组织</span>
                        <span class="text-gray-800 font-black">锦绣花园广场组织</span>
                    </div>
                    <div class="flex justify-between items-center text-sm border-t border-gray-50 pt-3">
                        <span class="text-gray-400 font-bold">创建时间</span>
                        <span class="text-gray-800 font-black">2026-03-01</span>
                    </div>
                </div>
            </div>

            <!-- 退出登录 -->
            <a class="block w-full py-4 bg-red-50 text-red-600 text-center rounded-[24px] font-bold text-sm active:scale-[0.98] transition-transform" href="#">
                退出当前登录
            </a>

            <!-- 版本信息 -->
            <div class="text-center py-6">
                <p class="text-[10px] text-gray-300 font-bold tracking-widest leading-relaxed uppercase">
                    寓管家 Pro Version 2.4.0<br/>
                    © 2026 SpaceFlow Tech. All Rights Reserved.
                </p>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 w-[359px] h-16 bg-white border-t border-gray-100 flex items-center justify-around rounded-b-[32px] z-50">
            <a class="flex flex-col items-center text-gray-400" href="layout-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">首页</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="apartment-list-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-work-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">房源</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="tenants-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:group-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">客户</span>
            </a>
            <a class="flex flex-col items-center text-gray-400 relative" href="bills-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:receipt-long-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">账单</span>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[8px] font-bold rounded-full flex items-center justify-center">5</span>
            </a>
            <a class="flex flex-col items-center text-blue-600" href="profile-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:person-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">我的</span>
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
