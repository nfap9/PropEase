<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寓管家 - 房间管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        body { background-color: #f1f5f9; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: #f8fafc; }
        .app-container::-webkit-scrollbar { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="app-container pb-20">
        <!-- 状态栏 -->
        <div class="px-6 py-4 flex justify-between items-center text-xs font-medium bg-white/80 backdrop-blur-md sticky top-0 z-50">
            <span id="current-time">09:41</span>
            <div class="flex space-x-1">
                <span class="iconify text-lg" data-icon="material-symbols:signal-cellular-4-bar"></span>
                <span class="iconify text-lg" data-icon="material-symbols:wifi-rounded"></span>
                <span class="iconify text-lg" data-icon="material-symbols:battery-5-bar"></span>
            </div>
        </div>

        <!-- 顶部导航 -->
        <div class="bg-gradient-to-br from-blue-700 to-blue-500 pt-6 pb-6 px-5">
            <div class="flex items-center justify-between mb-4">
                <a href="apartment-list-design.html" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center">
                    <span class="iconify text-white text-xl" data-icon="material-symbols:arrow-back-rounded"></span>
                </a>
                <h1 class="text-lg font-black text-white">全部房间</h1>
                <button class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center">
                    <span class="iconify text-white text-xl" data-icon="material-symbols:add"></span>
                </button>
            </div>
        </div>

        <!-- 搜索筛选 -->
        <div class="bg-white px-5 py-4 -mt-4">
            <div class="relative mb-4">
                <span class="iconify absolute left-4 top-3 text-gray-400" data-icon="material-symbols:search-rounded"></span>
                <input class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-2xl focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-50/50 transition-all outline-none text-sm" placeholder="搜索房间号"/>
            </div>
            <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-1">
                <button class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-full whitespace-nowrap">全部</button>
                <button class="px-4 py-2 bg-gray-100 text-gray-500 text-xs font-bold rounded-full whitespace-nowrap">空房</button>
                <button class="px-4 py-2 bg-gray-100 text-gray-500 text-xs font-bold rounded-full whitespace-nowrap">已租</button>
                <button class="px-4 py-2 bg-gray-100 text-gray-500 text-xs font-bold rounded-full whitespace-nowrap">维修中</button>
                <button class="px-4 py-2 bg-gray-100 text-gray-500 text-xs font-bold rounded-full whitespace-nowrap">阳光公寓A栋</button>
            </div>
        </div>

        <!-- 统计 -->
        <div class="px-5 mt-2">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                <div class="grid grid-cols-4 gap-4 text-center">
                    <div class="text-center">
                        <div class="text-2xl font-black text-gray-700">286</div>
                        <div class="text-[9px] text-gray-400 font-medium">全部</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-black text-emerald-600">68</div>
                        <div class="text-[9px] text-gray-400 font-medium">空房</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-black text-blue-600">198</div>
                        <div class="text-[9px] text-gray-400 font-medium">已租</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-black text-orange-600">20</div>
                        <div class="text-[9px] text-gray-400 font-medium">维修</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 房间列表 -->

            <!-- 房间 1 -->

                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                            <span class="iconify text-xl text-blue-600" data-icon="material-symbols:door-open"></span>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 bg-gray-100 text-gray-500 text-[9px] font-bold rounded">阳光A</span>
                                <span class="font-bold text-gray-800">101</span>
                            </div>
                            <div class="text-[11px] text-gray-400 mt-0.5">¥2500/月</div>

                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold rounded-full">已租</span>
                        <span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
                    </div>
                </div>
                <div class="mt-3 pt-3 border-t border-gray-50 flex items-center justify-between">
                    <div class="flex items-center space-x-1">
                        <span class="iconify text-gray-400 text-sm" data-icon="material-symbols:person-outline"></span>
                        <span class="text-sm text-gray-600 font-medium">张三</span>
                    </div>
                    <span class="text-[10px] text-gray-400">租约至 2026-06-15</span>
                </div>
            </div>

            <!-- 房间 2 -->
            <div class="bg-white rounded-[24px] p-4 shadow-sm border border-gray-100 mb-3 active:scale-[0.98] transition-transform">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center">
                            <span class="iconify text-xl text-emerald-600" data-icon="material-symbols:door-open"></span>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 bg-gray-100 text-gray-500 text-[9px] font-bold rounded">阳光A</span>
                                <span class="font-bold text-gray-800">102</span>
                            </div>
                            <div class="text-[11px] text-gray-400 mt-0.5">¥2800/月</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="px-3 py-1 bg-emerald-50 text-emerald-600 text-[10px] font-bold rounded-full">空房</span>
                        <span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
                    </div>
                </div>
            </div>

            <!-- 房间 3 -->
            <div class="bg-white rounded-[24px] p-4 shadow-sm border border-gray-100 mb-3 active:scale-[0.98] transition-transform">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-orange-50 rounded-2xl flex items-center justify-center">
                            <span class="iconify text-xl text-orange-600" data-icon="material-symbols:construction-rounded"></span>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 bg-gray-100 text-gray-500 text-[9px] font-bold rounded">阳光A</span>
                                <span class="font-bold text-gray-800">103</span>
                            </div>
                            <div class="text-[11px] text-gray-400 mt-0.5">¥2500/月</div>

                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="px-3 py-1 bg-orange-50 text-orange-600 text-[10px] font-bold rounded-full">维修中</span>
                        <span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
                    </div>
                </div>
            </div>

            <!-- 房间 4 -->
            <div class="bg-white rounded-[24px] p-4 shadow-sm border border-gray-100 mb-3 active:scale-[0.98] transition-transform">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                            <span class="iconify text-xl text-blue-600" data-icon="material-symbols:door-open"></span>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">

                                <span class="font-bold text-gray-800">201</span>

                    <div class="flex items-center space-x-2">

                        <span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
                    </div>
                </div>
                <div class="mt-3 pt-3 border-t border-gray-50 flex items-center justify-between">
                    <div class="flex items-center space-x-1">
                        <span class="iconify text-gray-400 text-sm" data-icon="material-symbols:person-outline"></span>

                    </div>
                    <span class="text-[10px] text-gray-400">租约至 2026-09-30</span>
                </div>
            </div>

            <!-- 房间 5 -->
            <div class="bg-white rounded-[24px] p-4 shadow-sm border border-gray-100 mb-3 active:scale-[0.98] transition-transform">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center">
                            <span class="iconify text-xl text-emerald-600" data-icon="material-symbols:door-open"></span>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">

                    </div>
                    <div class="flex items-center space-x-2">

                        <span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>

                        <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center">
                            <span class="iconify text-xl text-blue-600" data-icon="material-symbols:door-open"></span>
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 bg-emerald-50 text-emerald-500 text-[9px] font-bold rounded">通州果园</span>
                                <span class="font-bold text-gray-800">301</span>
                            </div>
                            <div class="text-[11px] text-gray-400 mt-0.5">¥1800/月</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold rounded-full">已租</span>
                        <span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
                    </div>
                </div>
                <div class="mt-3 pt-3 border-t border-gray-50 flex items-center justify-between">
                    <div class="flex items-center space-x-1">
                        <span class="iconify text-gray-400 text-sm" data-icon="material-symbols:person-outline"></span>
                        <span class="text-sm text-gray-600 font-medium">王五</span>
                    </div>
                    <span class="text-[10px] text-gray-400">租约至 2026-04-20</span>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 w-[359px] h-16 bg-white border-t border-gray-100 flex items-center justify-around rounded-b-[32px] z-50">
            <a class="flex flex-col items-center text-gray-400" href="layout-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">首页</span>
            </a>
            <a class="flex flex-col items-center text-blue-600" href="apartment-list-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-work-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">房源</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="tenants-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:group-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">客户</span>
            </a>
            <a class="flex flex-col items-center text-gray-400 relative" href="bills-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:receipt-long-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">账单</span>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[8px] font-bold rounded-full flex items-center justify-center">5</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="profile-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:person-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">我的</span>
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
