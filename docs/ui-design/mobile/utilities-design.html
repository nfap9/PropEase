<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寓管家 - 水电管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        body { background-color: #f1f5f9; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: #f8fafc; }
        .app-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="app-container pb-20">
        <!-- 状态栏 -->
        <div class="px-6 py-4 flex justify-between items-center text-xs font-medium bg-white/80 backdrop-blur-md sticky top-0 z-50">
            <span id="current-time">09:41</span>
            <div class="flex space-x-1">
                <span class="iconify text-lg" data-icon="material-symbols:signal-cellular-4-bar"></span>
                <span class="iconify text-lg" data-icon="material-symbols:wifi-rounded"></span>
                <span class="iconify text-lg" data-icon="material-symbols:battery-5-bar"></span>
            </div>
        </div>

        <!-- 顶部 -->
        <div class="bg-gradient-to-br from-blue-700 to-blue-500 pt-6 pb-8 px-5 rounded-b-[40px]">
            <h1 class="text-2xl font-black text-white mb-4 tracking-tight">水电管理</h1>
            <div class="flex space-x-3 overflow-x-auto no-scrollbar">
                <button class="px-4 py-2 bg-white/20 backdrop-blur-md text-white text-xs font-bold rounded-full whitespace-nowrap border border-white/20">全部</button>
                <button class="px-4 py-2 bg-white/10 backdrop-blur-md text-white/70 text-xs font-bold rounded-full whitespace-nowrap border border-white/10">待录入</button>
                <button class="px-4 py-2 bg-white/10 backdrop-blur-md text-white/70 text-xs font-bold rounded-full whitespace-nowrap border border-white/10">已录入</button>
                <button class="px-4 py-2 bg-white/10 backdrop-blur-md text-white/70 text-xs font-bold rounded-full whitespace-nowrap border border-white/10">阳光公寓</button>
            </div>
        </div>

        <!-- 统计 -->
        <div class="px-5 -mt-6">
            <div class="bg-white rounded-3xl p-4 shadow-lg border border-gray-50">
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-orange-50 rounded-2xl p-4 text-center">
                        <div class="text-2xl font-black text-orange-600">12</div>
                        <div class="text-[9px] text-orange-500 font-bold">待录入房间</div>
                    </div>
                    <div class="bg-emerald-50 rounded-2xl p-4 text-center">
                        <div class="text-2xl font-black text-emerald-600">186</div>
                        <div class="text-[9px] text-emerald-500 font-bold">已录入房间</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 待录入列表 -->
        <div class="px-5 mt-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-black text-lg text-gray-800">待录入水电</h2>
                <button class="text-xs text-blue-600 font-bold">批量导入</button>
            </div>

            <!-- 房间 1 - 红色预警 -->
            <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100 mb-3 active:scale-[0.98] transition-transform">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-lg text-red-500" data-icon="material-symbols:water-drop-rounded"></span>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800 text-sm">阳光公寓A栋 - 101</div>
                            <div class="text-[10px] text-red-500 font-bold">已逾期 5 天</div>
                        </div>
                    </div>
                    <span class="w-2 h-2 bg-red-500 rounded-full"></span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-xl p-3">
                        <div class="text-[10px] text-gray-400 mb-1">上期读数</div>
                        <div class="text-sm font-bold text-gray-700">水: 23.5 m³</div>
                        <div class="text-sm font-bold text-gray-700">电: 256 kWh</div>
                    </div>
                    <div class="bg-blue-50 rounded-xl p-3">
                        <div class="text-[10px] text-blue-400 mb-1">本期读数</div>
                        <input class="w-full bg-white border border-blue-200 rounded-lg px-2 py-1 text-xs" placeholder="水表读数"/>
                        <input class="w-full bg-white border border-blue-200 rounded-lg px-2 py-1 text-xs mt-1" placeholder="电表读数"/>
                    </div>
                </div>
            </div>

            <!-- 房间 2 - 黄色预警 -->
            <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100 mb-3 active:scale-[0.98] transition-transform">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-orange-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-lg text-orange-500" data-icon="material-symbols:water-drop-rounded"></span>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800 text-sm">望京SOHO公寓 - 201</div>
                            <div class="text-[10px] text-orange-500 font-bold">还剩 3 天</div>
                        </div>
                    </div>
                    <span class="w-2 h-2 bg-orange-500 rounded-full"></span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-xl p-3">
                        <div class="text-[10px] text-gray-400 mb-1">上期读数</div>
                        <div class="text-sm font-bold text-gray-700">水: 18.2 m³</div>
                        <div class="text-sm font-bold text-gray-700">电: 312 kWh</div>
                    </div>
                    <div class="bg-blue-50 rounded-xl p-3">
                        <div class="text-[10px] text-blue-400 mb-1">本期读数</div>
                        <input class="w-full bg-white border border-blue-200 rounded-lg px-2 py-1 text-xs" placeholder="水表读数"/>
                        <input class="w-full bg-white border border-blue-200 rounded-lg px-2 py-1 text-xs mt-1" placeholder="电表读数"/>
                    </div>
                </div>
            </div>

            <!-- 房间 3 - 正常 -->
            <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100 mb-3 active:scale-[0.98] transition-transform">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-lg text-blue-500" data-icon="material-symbols:water-drop-rounded"></span>
                        </div>
                        <div>
                            <div class="font-bold text-gray-800 text-sm">通州果园小区 - 301</div>
                            <div class="text-[10px] text-blue-500 font-bold">还剩 10 天</div>
                        </div>
                    </div>
                    <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-xl p-3">
                        <div class="text-[10px] text-gray-400 mb-1">上期读数</div>
                        <div class="text-sm font-bold text-gray-700">水: 15.0 m³</div>
                        <div class="text-sm font-bold text-gray-700">电: 180 kWh</div>
                    </div>
                    <div class="bg-blue-50 rounded-xl p-3">
                        <div class="text-[10px] text-blue-400 mb-1">本期读数</div>
                        <input class="w-full bg-white border border-blue-200 rounded-lg px-2 py-1 text-xs" placeholder="水表读数"/>
                        <input class="w-full bg-white border border-blue-200 rounded-lg px-2 py-1 text-xs mt-1" placeholder="电表读数"/>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 w-[359px] h-16 bg-white border-t border-gray-100 flex items-center justify-around rounded-b-[32px] z-50">
            <a class="flex flex-col items-center text-gray-400" href="layout-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">首页</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="apartment-list-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-work-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">房源</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="tenants-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:group-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">客户</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="bills-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:receipt-long-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">账单</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="profile-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:person-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">我的</span>
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
