<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寓管家 - 房源管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        body { background-color: #f1f5f9; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: #f8fafc; }
        .app-container::-webkit-scrollbar { display: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="app-container pb-20">
        <!-- 状态栏 -->
        <div class="px-6 py-4 flex justify-between items-center text-xs font-medium bg-white/80 backdrop-blur-md sticky top-0 z-50">
            <span id="current-time">09:41</span>
            <div class="flex space-x-1">
                <span class="iconify text-lg" data-icon="material-symbols:signal-cellular-4-bar"></span>
                <span class="iconify text-lg" data-icon="material-symbols:wifi-rounded"></span>
                <span class="iconify text-lg" data-icon="material-symbols:battery-5-bar"></span>
            </div>
        </div>

        <!-- 顶部搜索区 -->
        <div class="bg-gradient-to-br from-blue-700 to-blue-500 pt-6 pb-8 px-5 rounded-b-[40px]">
            <h1 class="text-2xl font-black text-white mb-4 tracking-tight">房源管理</h1>
            <div class="relative">
                <span class="iconify absolute left-4 top-3.5 text-gray-400" data-icon="material-symbols:search-rounded"></span>
                <input class="w-full pl-11 pr-4 py-3 bg-white/20 backdrop-blur-md border border-white/20 rounded-2xl focus:bg-white focus:border-blue-400 focus:ring-4 focus:ring-white/20 transition-all outline-none text-sm text-white placeholder-white/70" placeholder="搜索公寓名称或地址"/>
            </div>
        </div>

        <!-- 统计概览 -->
        <div class="px-5 -mt-6">
            <div class="bg-white rounded-3xl p-4 shadow-lg shadow-blue-900/5 border border-gray-50">
                <div class="grid grid-cols-5 gap-2 text-center">
                    <div class="text-center">
                        <div class="text-2xl font-black text-gray-800">12</div>
                        <div class="text-[10px] text-gray-400 font-medium">公寓</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-black text-gray-600">286</div>
                        <div class="text-[10px] text-gray-400 font-medium">总房间</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-black text-emerald-600">68</div>
                        <div class="text-[10px] text-gray-400 font-medium">空房</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-black text-blue-600">198</div>
                        <div class="text-[10px] text-gray-400 font-medium">已租</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-black text-orange-600">20</div>
                        <div class="text-[10px] text-gray-400 font-medium">维修</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 公寓列表 -->
        <div class="px-5 mt-6">
            <!-- 公寓卡片 1 -->
            <a href="apartment-detail-design.html" class="block bg-white rounded-[28px] p-5 shadow-sm border border-gray-100 mb-4 group active:scale-[0.98] transition-transform">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-md shadow-blue-200">
                            <span class="iconify text-white text-xl" data-icon="material-symbols:home-work-rounded"></span>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">阳光公寓A栋</h3>
                            <div class="flex items-center text-[11px] text-gray-400 mt-0.5">
                                <span class="iconify" data-icon="material-symbols:location-on"></span>
                                <span>朝阳区建国路88号</span>
                            </div>
                        </div>
                    </div>
                    <button class="w-8 h-8 flex items-center justify-center text-gray-300 hover:bg-gray-50 rounded-xl transition-colors" onclick="event.preventDefault(); toggleMenu()">
                        <span class="iconify text-lg" data-icon="material-symbols:more-vert"></span>
                    </button>
                </div>

                <!-- 房间统计 -->
                <div class="grid grid-cols-4 gap-3 mb-4">
                    <div class="bg-gray-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-gray-700">50</div>
                        <div class="text-[9px] text-gray-400 font-medium">总房间</div>
                    </div>
                    <div class="bg-emerald-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-emerald-600">12</div>
                        <div class="text-[9px] text-gray-400 font-medium">空房</div>
                    </div>
                    <div class="bg-blue-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-blue-600">35</div>
                        <div class="text-[9px] text-gray-400 font-medium">已租</div>
                    </div>
                    <div class="bg-orange-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-orange-600">3</div>
                        <div class="text-[9px] text-gray-400 font-medium">维修</div>
                    </div>
                </div>

                <!-- 入住率进度条 -->
                <div class="bg-gray-50 rounded-2xl p-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-gray-500">入住率</span>
                        <span class="text-xs font-black text-blue-600">70%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-blue-600 rounded-full" style="width: 70%;"></div>
                    </div>
                </div>
            </a>

            <!-- 公寓卡片 2 -->
            <a href="apartment-detail-design.html" class="block bg-white rounded-[28px] p-5 shadow-sm border border-gray-100 mb-4 group active:scale-[0.98] transition-transform">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-md shadow-purple-200">
                            <span class="iconify text-white text-xl" data-icon="material-symbols:home-work-rounded"></span>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">望京SOHO公寓</h3>
                            <div class="flex items-center text-[11px] text-gray-400 mt-0.5">
                                <span class="iconify" data-icon="material-symbols:location-on"></span>
                                <span>朝阳区望京街10号</span>
                            </div>
                        </div>
                    </div>
                    <button class="w-8 h-8 flex items-center justify-center text-gray-300 hover:bg-gray-50 rounded-xl transition-colors" onclick="event.preventDefault();">
                        <span class="iconify text-lg" data-icon="material-symbols:more-vert"></span>
                    </button>
                </div>

                <div class="grid grid-cols-4 gap-3 mb-4">
                    <div class="bg-gray-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-gray-700">36</div>
                        <div class="text-[9px] text-gray-400 font-medium">总房间</div>
                    </div>
                    <div class="bg-emerald-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-emerald-600">8</div>
                        <div class="text-[9px] text-gray-400 font-medium">空房</div>
                    </div>
                    <div class="bg-blue-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-blue-600">26</div>
                        <div class="text-[9px] text-gray-400 font-medium">已租</div>
                    </div>
                    <div class="bg-orange-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-orange-600">2</div>
                        <div class="text-[9px] text-gray-400 font-medium">维修</div>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-2xl p-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-gray-500">入住率</span>
                        <span class="text-xs font-black text-blue-600">72%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-blue-600 rounded-full" style="width: 72%;"></div>
                    </div>
                </div>
            </a>

            <!-- 公寓卡片 3 -->
            <a href="apartment-detail-design.html" class="block bg-white rounded-[28px] p-5 shadow-sm border border-gray-100 mb-4 group active:scale-[0.98] transition-transform">
                <div class="flex items-start justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl flex items-center justify-center shadow-md shadow-emerald-200">
                            <span class="iconify text-white text-xl" data-icon="material-symbols:home-work-rounded"></span>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800">通州果园小区</h3>
                            <div class="flex items-center text-[11px] text-gray-400 mt-0.5">
                                <span class="iconify" data-icon="material-symbols:location-on"></span>
                                <span>通州区新华南路25号</span>
                            </div>
                        </div>
                    </div>
                    <button class="w-8 h-8 flex items-center justify-center text-gray-300 hover:bg-gray-50 rounded-xl transition-colors" onclick="event.preventDefault();">
                        <span class="iconify text-lg" data-icon="material-symbols:more-vert"></span>
                    </button>
                </div>

                <div class="grid grid-cols-4 gap-3 mb-4">
                    <div class="bg-gray-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-gray-700">24</div>
                        <div class="text-[9px] text-gray-400 font-medium">总房间</div>
                    </div>
                    <div class="bg-emerald-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-emerald-600">15</div>
                        <div class="text-[9px] text-gray-400 font-medium">空房</div>
                    </div>
                    <div class="bg-blue-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-blue-600">9</div>
                        <div class="text-[9px] text-gray-400 font-medium">已租</div>
                    </div>
                    <div class="bg-gray-50 rounded-2xl p-3 text-center">
                        <div class="text-lg font-black text-gray-400">0</div>
                        <div class="text-[9px] text-gray-400 font-medium">维修</div>
                    </div>
                </div>

                <div class="bg-gray-50 rounded-2xl p-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[10px] font-bold text-gray-500">入住率</span>
                        <span class="text-xs font-black text-emerald-600">38%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-500 rounded-full" style="width: 38%;"></div>
                    </div>
                </div>
            </a>
        </div>

        <!-- 快捷入口按钮 -->
        <div class="fixed bottom-20 right-5 z-40">
            <a href="rooms-design.html" class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-lg shadow-gray-200 border border-gray-100 mb-3 active:scale-95 transition-transform">
                <span class="iconify text-xl text-gray-600" data-icon="material-symbols:door-open"></span>
            </a>
            <button class="w-14 h-14 bg-gradient-to-r from-blue-600 to-blue-500 rounded-full flex items-center justify-center shadow-lg shadow-blue-200 active:scale-95 transition-transform">
                <span class="iconify text-2xl text-white" data-icon="material-symbols:add"></span>
            </button>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 w-[359px] h-16 bg-white border-t border-gray-100 flex items-center justify-around rounded-b-[32px] z-50">
            <a class="flex flex-col items-center text-gray-400" href="layout-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">首页</span>
            </a>
            <a class="flex flex-col items-center text-blue-600" href="apartment-list-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-work-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">房源</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="tenants-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:group-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">客户</span>
            </a>
            <a class="flex flex-col items-center text-gray-400 relative" href="bills-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:receipt-long-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">账单</span>
                <span class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 text-white text-[8px] font-bold rounded-full flex items-center justify-center">5</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="profile-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:person-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">我的</span>
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        function toggleMenu() {
            // 菜单切换逻辑
        }
    </script>
</body>
</html>
