<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寓管家 - 经营报表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { background-color: #f1f5f9; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: #f8fafc; }
        .app-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="app-container pb-20">
        <!-- 状态栏 -->
        <div class="px-6 py-4 flex justify-between items-center text-xs font-medium bg-white/80 backdrop-blur-md sticky top-0 z-50">
            <span id="current-time">09:41</span>
            <div class="flex space-x-1">
                <span class="iconify text-lg" data-icon="material-symbols:signal-cellular-4-bar"></span>
                <span class="iconify text-lg" data-icon="material-symbols:wifi-rounded"></span>
                <span class="iconify text-lg" data-icon="material-symbols:battery-5-bar"></span>
            </div>
        </div>

        <!-- 顶部 -->
        <div class="bg-gradient-to-br from-blue-700 to-blue-500 pt-6 pb-8 px-5 rounded-b-[40px]">
            <h1 class="text-2xl font-black text-white mb-4 tracking-tight">经营报表</h1>
            <div class="flex space-x-2 overflow-x-auto no-scrollbar">
                <button class="px-4 py-2 bg-white/20 backdrop-blur-md text-white text-xs font-bold rounded-full whitespace-nowrap border border-white/20">本月</button>
                <button class="px-4 py-2 bg-white/10 backdrop-blur-md text-white/70 text-xs font-bold rounded-full whitespace-nowrap border border-white/10">本季度</button>
                <button class="px-4 py-2 bg-white/10 backdrop-blur-md text-white/70 text-xs font-bold rounded-full whitespace-nowrap border border-white/10">本年</button>
            </div>
        </div>

        <!-- 收入概览 -->
        <div class="px-5 -mt-6">
            <div class="bg-white rounded-[24px] p-5 shadow-lg border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-sm font-bold text-gray-500">本月收入</span>
                    <span class="text-xs text-blue-600 font-bold">详细</span>
                </div>
                <div class="text-4xl font-black text-gray-800 mb-4">¥ 124,580</div>
                <div class="flex items-center text-xs">
                    <span class="iconify text-emerald-500 mr-1" data-icon="material-symbols:trending-up-rounded"></span>
                    <span class="text-emerald-600 font-bold">+12.5%</span>
                    <span class="text-gray-400 ml-1">较上月</span>
                </div>
            </div>
        </div>

        <!-- 收支统计图表 -->
        <div class="px-5 mt-4">
            <div class="bg-white rounded-[24px] p-4 shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-bold text-gray-800">收支趋势</h2>
                    <div class="flex space-x-2">
                        <span class="w-3 h-3 bg-blue-500 rounded-full"></span>
                        <span class="text-[10px] text-gray-400">收入</span>
                        <span class="w-3 h-3 bg-red-400 rounded-full ml-2"></span>
                        <span class="text-[10px] text-gray-400">支出</span>
                    </div>
                </div>
                <div class="w-full h-40" id="trendChart"></div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="px-5 mt-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100">
                    <div class="flex items-center space-x-2 mb-2">
                        <div class="w-8 h-8 bg-emerald-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-emerald-600" data-icon="material-symbols:trending-up-rounded"></span>
                        </div>
                        <span class="text-[10px] text-gray-400">收入</span>
                    </div>
                    <div class="text-xl font-black text-gray-800">¥12.4w</div>
                    <div class="text-[10px] text-emerald-500 mt-1">+15.2%</div>
                </div>
                <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100">
                    <div class="flex items-center space-x-2 mb-2">
                        <div class="w-8 h-8 bg-red-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-red-500" data-icon="material-symbols:trending-down-rounded"></span>
                        </div>
                        <span class="text-[10px] text-gray-400">支出</span>
                    </div>
                    <div class="text-xl font-black text-gray-800">¥3.2w</div>
                    <div class="text-[10px] text-red-400 mt-1">+8.5%</div>
                </div>
            </div>
        </div>

        <!-- 房源统计 -->
        <div class="px-5 mt-4">
            <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-3">房源统计</h3>
                <div class="grid grid-cols-4 gap-2 text-center">
                    <div>
                        <div class="text-xl font-black text-gray-700">12</div>
                        <div class="text-[9px] text-gray-400">公寓</div>
                    </div>
                    <div>
                        <div class="text-xl font-black text-gray-700">286</div>
                        <div class="text-[9px] text-gray-400">房间</div>
                    </div>
                    <div>
                        <div class="text-xl font-black text-emerald-600">198</div>
                        <div class="text-[9px] text-gray-400">入住</div>
                    </div>
                    <div>
                        <div class="text-xl font-black text-orange-600">68</div>
                        <div class="text-[9px] text-gray-400">空置</div>
                    </div>
                </div>
                <div class="mt-4">
                    <div class="flex justify-between text-[10px] mb-1">
                        <span class="text-gray-400">入住率</span>
                        <span class="font-bold text-blue-600">69.2%</span>
                    </div>
                    <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-blue-600 rounded-full" style="width: 69.2%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 租客统计 -->
        <div class="px-5 mt-4 mb-6">
            <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100">
                <h3 class="font-bold text-gray-800 mb-3">租客统计</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="iconify text-blue-500" data-icon="material-symbols:person-rounded"></span>
                            <span class="text-sm text-gray-600">在租租客</span>
                        </div>
                        <span class="font-bold text-gray-800">142 人</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="iconify text-orange-500" data-icon="material-symbols:warning-rounded"></span>
                            <span class="text-sm text-gray-600">即将到期</span>
                        </div>
                        <span class="font-bold text-orange-600">14 人</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="iconify text-red-500" data-icon="material-symbols:event-busy-rounded"></span>
                            <span class="text-sm text-gray-600">已逾期</span>
                        </div>
                        <span class="font-bold text-red-600">3 人</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 w-[359px] h-16 bg-white border-t border-gray-100 flex items-center justify-around rounded-b-[32px] z-50">
            <a class="flex flex-col items-center text-gray-400" href="layout-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">首页</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="apartment-list-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-work-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">房源</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="tenants-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:group-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">客户</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="bills-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:receipt-long-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">账单</span>
            </a>
            <a class="flex flex-col items-center text-blue-600" href="profile-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:person-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">我的</span>
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 图表
        window.onload = function() {
            var chartDom = document.getElementById('trendChart');
            var myChart = echarts.init(chartDom);
            var option = {
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: ['1月', '2月', '3月'], axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#9CA3AF', fontSize: 10 } },
                yAxis: { type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { type: 'dashed' } }, axisLabel: { color: '#9CA3AF', fontSize: 10 } },
                series: [
                    {
                        name: '收入',
                        data: [12000, 15000, 19200],
                        type: 'bar',
                        barWidth: '30%',
                        itemStyle: { borderRadius: [6, 6, 0, 0], color: '#3B82F6' }
                    },
                    {
                        name: '支出',
                        data: [3000, 2800, 3200],
                        type: 'bar',
                        barWidth: '30%',
                        itemStyle: { borderRadius: [6, 6, 0, 0], color: '#F87171' }
                    }
                ]
            };
            myChart.setOption(option);
        };
    </script>
</body>
</html>
