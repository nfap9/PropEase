<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寓管家 - 费用配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
    <style>
        body { background-color: #f1f5f9; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: #f8fafc; }
        .app-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="app-container pb-20">
        <!-- 状态栏 -->
        <div class="px-6 py-4 flex justify-between items-center text-xs font-medium bg-white/80 backdrop-blur-md sticky top-0 z-50">
            <span id="current-time">09:41</span>
            <div class="flex space-x-1">
                <span class="iconify text-lg" data-icon="material-symbols:signal-cellular-4-bar"></span>
                <span class="iconify text-lg" data-icon="material-symbols:wifi-rounded"></span>
                <span class="iconify text-lg" data-icon="material-symbols:battery-5-bar"></span>
            </div>
        </div>

        <!-- 顶部导航 -->
        <div class="bg-gradient-to-br from-blue-700 to-blue-500 pt-6 pb-6 px-5 rounded-b-[40px]">
            <div class="flex items-center justify-between">
                <a href="profile-design.html" class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center">
                    <span class="iconify text-white text-xl" data-icon="material-symbols:arrow-back-rounded"></span>
                </a>
                <h1 class="text-lg font-black text-white">费用配置</h1>
                <button class="text-white text-sm font-bold">保存</button>
            </div>
        </div>

        <!-- 配置内容 -->
        <div class="px-5 mt-4">
            <!-- 水电单价配置 -->
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 mb-4 overflow-hidden">
                <div class="p-4 border-b border-gray-50 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-lg text-blue-600" data-icon="material-symbols:water-drop-rounded"></span>
                        </div>
                        <span class="font-bold text-gray-800">水电单价</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:expand-more-rounded"></span>
                </div>
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="iconify text-blue-500" data-icon="material-symbols:water-drop"></span>
                            <span class="text-sm text-gray-600">水费单价</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-20 text-right bg-gray-50 rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="3.50"/>
                            <span class="text-sm text-gray-400 ml-1">/m³</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="iconify text-yellow-500" data-icon="material-symbols:bolt-rounded"></span>
                            <span class="text-sm text-gray-600">电费单价</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-20 text-right bg-gray-50 rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="0.60"/>
                            <span class="text-sm text-gray-400 ml-1">/kWh</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 网费配置 -->
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 mb-4 overflow-hidden">
                <div class="p-4 border-b border-gray-50 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-lg text-purple-600" data-icon="material-symbols:wifi-rounded"></span>
                        </div>
                        <span class="font-bold text-gray-800">网费配置</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:expand-more-rounded"></span>
                </div>
                <div class="p-4 space-y-3">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div>
                            <div class="text-sm font-bold text-gray-800">50M 宽带</div>
                            <div class="text-[10px] text-gray-400">适合1-2人使用</div>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-16 text-right bg-white rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="30"/>
                            <span class="text-sm text-gray-400 ml-1">/月</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div>
                            <div class="text-sm font-bold text-gray-800">100M 宽带</div>
                            <div class="text-[10px] text-gray-400">适合3-4人使用</div>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-16 text-right bg-white rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="50"/>
                            <span class="text-sm text-gray-400 ml-1">/月</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div>
                            <div class="text-sm font-bold text-gray-800">200M 宽带</div>
                            <div class="text-[10px] text-gray-400">适合5人以上</div>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-16 text-right bg-white rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="80"/>
                            <span class="text-sm text-gray-400 ml-1">/月</span>
                        </div>
                    </div>
                    <button class="w-full py-3 border border-dashed border-gray-200 rounded-xl text-sm text-gray-400 font-medium flex items-center justify-center">
                        <span class="iconify mr-1" data-icon="material-symbols:add"></span>
                        添加网费套餐
                    </button>
                </div>
            </div>

            <!-- 管理费配置 -->
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 mb-4 overflow-hidden">
                <div class="p-4 border-b border-gray-50 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-lg text-emerald-600" data-icon="material-symbols:assignment-rounded"></span>
                        </div>
                        <span class="font-bold text-gray-800">管理费配置</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:expand-more-rounded"></span>
                </div>
                <div class="p-4 space-y-3">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div>
                            <div class="text-sm font-bold text-gray-800">日常管理费</div>
                            <div class="text-[10px] text-gray-400">公共区域维护、垃圾清运</div>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-16 text-right bg-white rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="50"/>
                            <span class="text-sm text-gray-400 ml-1">/月</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                        <div>
                            <div class="text-sm font-bold text-gray-800">维修基金</div>
                            <div class="text-[10px] text-gray-400">用于房间维修</div>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-16 text-right bg-white rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="20"/>
                            <span class="text-sm text-gray-400 ml-1">/月</span>
                        </div>
                    </div>
                    <button class="w-full py-3 border border-dashed border-gray-200 rounded-xl text-sm text-gray-400 font-medium flex items-center justify-center">
                        <span class="iconify mr-1" data-icon="material-symbols:add"></span>
                        添加管理费项目
                    </button>
                </div>
            </div>

            <!-- 其他费用 -->
            <div class="bg-white rounded-[24px] shadow-sm border border-gray-100 mb-4 overflow-hidden">
                <div class="p-4 border-b border-gray-50 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-orange-50 rounded-xl flex items-center justify-center">
                            <span class="iconify text-lg text-orange-600" data-icon="material-symbols:more-horiz-rounded"></span>
                        </div>
                        <span class="font-bold text-gray-800">其他费用</span>
                    </div>
                    <span class="iconify text-gray-300" data-icon="material-symbols:expand-more-rounded"></span>
                </div>
                <div class="p-4">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl mb-3">
                        <div>
                            <div class="text-sm font-bold text-gray-800">车位费</div>
                            <div class="text-[10px] text-gray-400">地上/地下停车位</div>
                        </div>
                        <div class="flex items-center">
                            <span class="text-sm text-gray-400 mr-1">¥</span>
                            <input class="w-16 text-right bg-white rounded-lg px-2 py-1 text-sm font-bold text-gray-800" value="200"/>
                            <span class="text-sm text-gray-400 ml-1">/月</span>
                        </div>
                    </div>
                    <button class="w-full py-3 border border-dashed border-gray-200 rounded-xl text-sm text-gray-400 font-medium flex items-center justify-center">
                        <span class="iconify mr-1" data-icon="material-symbols:add"></span>
                        添加其他费用
                    </button>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="fixed bottom-0 w-[359px] h-16 bg-white border-t border-gray-100 flex items-center justify-around rounded-b-[32px] z-50">
            <a class="flex flex-col items-center text-gray-400" href="layout-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">首页</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="apartment-list-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:home-work-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">房源</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="tenants-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:group-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">客户</span>
            </a>
            <a class="flex flex-col items-center text-gray-400" href="bills-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:receipt-long-outline"></span>
                <span class="text-[10px] mt-0.5 font-bold">账单</span>
            </a>
            <a class="flex flex-col items-center text-blue-600" href="profile-design.html">
                <span class="iconify text-xl" data-icon="material-symbols:person-rounded"></span>
                <span class="text-[10px] mt-0.5 font-bold">我的</span>
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').innerText = timeStr;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
