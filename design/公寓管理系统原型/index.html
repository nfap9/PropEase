<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>登录 - 云寓 CloudApart 公寓管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        .login-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center font-sans">
<div class="container max-w-[1200px] mx-auto flex h-[700px] shadow-2xl rounded-3xl overflow-hidden">
<!-- 左侧：品牌展示 -->
<div class="hidden lg:flex flex-1 login-bg p-12 flex-col justify-between text-white relative">
<div class="relative z-10">
<div class="flex items-center gap-2 text-2xl font-bold mb-12">
<span class="iconify text-4xl" data-icon="solar:home-smile-bold-duotone"></span>
<span>云寓 CloudApart</span>
</div>
<h1 class="text-5xl font-extrabold leading-tight mb-6">全智能<br/>公寓管理解决方案</h1>
<p class="text-blue-100 text-lg max-w-md">提升运营效率 45%，降低欠费风险 30%。2026年最新款专业化管理工具，助力资产增值。</p>
</div>
<div class="z-10 grid grid-cols-2 gap-6">
<div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md border border-white/20">
<div class="text-2xl font-bold">1.2k+</div>
<div class="text-sm text-blue-100">管理公寓数</div>
</div>
<div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md border border-white/20">
<div class="text-2xl font-bold">98.5%</div>
<div class="text-sm text-blue-100">租客满意度</div>
</div>
</div>
<!-- 装饰圆圈 -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-400/20 rounded-full blur-3xl"></div>
</div>
<!-- 右侧：登录/注册表单 -->
<div class="w-full lg:w-[450px] bg-white p-12 flex flex-col justify-center">
<div id="loginForm">
<div class="mb-10">
<h2 class="text-3xl font-bold text-slate-800 mb-2">欢迎回来</h2>
<p class="text-slate-500">请登录您的管理后台</p>
</div>
<div class="space-y-6">
<div>
<label class="block text-sm font-medium text-slate-700 mb-2">手机号码</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
<span class="iconify" data-icon="solar:phone-bold"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none" placeholder="138 0000 0000" type="text"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-medium text-slate-700">登录密码</label>
<a class="text-xs text-indigo-600 hover:text-indigo-500" href="#">忘记密码？</a>
</div>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
<span class="iconify" data-icon="solar:lock-password-bold"></span>
</span>
<input class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" id="remember" type="checkbox"/>
<label class="ml-2 block text-sm text-slate-600" for="remember">30天内免登录</label>
</div>
<a class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all text-center block" href="dashboard.html">
                        立即登录
                    </a>
<div class="relative my-8">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
<div class="relative flex justify-center text-sm"><span class="px-2 bg-white text-slate-400">或其他登录方式</span></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-2 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all">
<span class="iconify text-green-500 text-xl" data-icon="ri:wechat-fill"></span>
<span class="text-sm font-medium text-slate-700">微信登录</span>
</button>
<button class="flex items-center justify-center gap-2 py-2 border border-slate-200 rounded-xl hover:bg-slate-50 transition-all">
<span class="iconify text-blue-500 text-xl" data-icon="uiw:qq"></span>
<span class="text-sm font-medium text-slate-700">账号登录</span>
</button>
</div>
</div>
<div class="mt-10 text-center">
<p class="text-slate-600 text-sm">还没有账号？ <button class="text-indigo-600 font-bold hover:underline" onclick="toggleForm()">立即免费注册</button></p>
</div>
</div>
<!-- 注册表单 (默认隐藏) -->
<div class="hidden" id="registerForm">
<div class="mb-8">
<h2 class="text-3xl font-bold text-slate-800 mb-2">免费注册</h2>
<p class="text-slate-500">开启您的智能化运营之旅</p>
</div>
<div class="space-y-4">
<div>
<label class="block text-sm font-medium text-slate-700 mb-1">手机号码</label>
<input class="block w-full px-3 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="请输入手机号" type="text"/>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 mb-1">验证码</label>
<div class="flex gap-2">
<input class="block flex-1 px-3 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="6位数字" type="text"/>
<button class="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-200 transition-all">获取验证码</button>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-700 mb-1">设置密码</label>
<input class="block w-full px-3 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="至少8位字符" type="password"/>
</div>
<button class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold mt-4 shadow-lg hover:bg-indigo-700 transition-all">
                        提交注册
                    </button>
</div>
<div class="mt-8 text-center">
<p class="text-slate-600 text-sm">已有账号？ <button class="text-indigo-600 font-bold hover:underline" onclick="toggleForm()">返回登录</button></p>
</div>
</div>
<p class="mt-12 text-center text-xs text-slate-400">
                本页面信息反映于 2026年3月10日<br/>
                © 2026 云寓 (CloudApart) Inc. 保留所有权利
            </p>
</div>
</div>
<script>
        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('registerForm').classList.toggle('hidden');
        }
    </script>
</body>
</html>
