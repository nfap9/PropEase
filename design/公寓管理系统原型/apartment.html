<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>公寓管理 - 云寓 CloudApart</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">
<div class="flex">
<!-- 侧边栏 (复用) -->
<aside class="w-64 bg-slate-900 h-screen fixed">
<div class="p-6 flex items-center gap-2 text-white">
<span class="iconify text-3xl text-indigo-400" data-icon="solar:home-smile-bold-duotone"></span>
<span class="text-xl font-bold tracking-tight">云寓管理</span>
</div>
<nav class="mt-6 px-4 space-y-2">
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="dashboard.html">
<span class="iconify text-xl" data-icon="solar:widget-bold"></span>
<span>控制台首页</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="organization.html">
<span class="iconify text-xl" data-icon="solar:users-group-rounded-bold"></span>
<span>组织管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 bg-indigo-600 text-white rounded-xl transition-all" href="apartment.html">
<span class="iconify text-xl" data-icon="solar:buildings-bold"></span>
<span>公寓管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="room.html">
<span class="iconify text-xl" data-icon="solar:bed-bold"></span>
<span>房间管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="lease.html">
<span class="iconify text-xl" data-icon="solar:document-add-bold"></span>
<span>租约管理</span>
</a>
<a class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-xl transition-all" href="billing.html">
<span class="iconify text-xl" data-icon="solar:bill-list-bold"></span>
<span>水电账单</span>
</a>
</nav>
</aside>
<!-- 主内容区 -->
<main class="ml-64 flex-1 p-8">
<header class="flex justify-between items-center mb-8">
<div>
<h1 class="text-2xl font-bold text-slate-800">公寓资产配置</h1>
<p class="text-slate-500 text-sm">配置公寓基础信息及费用单价，最后更新：2026-03-10</p>
</div>
<div class="flex gap-4">
<button class="bg-white text-slate-600 border border-slate-200 px-5 py-2.5 rounded-xl font-medium hover:bg-slate-50">历史操作</button>
<button class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-medium shadow-lg hover:bg-indigo-700 flex items-center gap-2">
<span class="iconify" data-icon="solar:plain-2-bold"></span>
                        录入新公寓
                    </button>
</div>
</header>
<!-- 核心功能区域 -->
<div class="grid grid-cols-12 gap-8">
<!-- 左侧：公寓详情编辑/维护 -->
<div class="col-span-8 space-y-6">
<div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
<div class="flex items-center gap-4 mb-8">
<img alt="Apartment Cover" class="w-32 h-24 rounded-2xl object-cover shrink-0" src="https://modao.cc/agent-py/media/generated_images/2026-03-10/1e3f6fb13e5e447cbf2f9648bcf089f2.jpg"/>
<div class="flex-1">
<h2 class="text-xl font-bold text-slate-800">锦绣华庭公寓 - A栋</h2>
<p class="text-slate-400 text-sm flex items-center gap-1 mt-1">
<span class="iconify text-indigo-500" data-icon="solar:map-point-bold"></span>
                                    上海市浦东新区张江路 888 号
                                </p>
<div class="mt-3 flex gap-2">
<span class="px-2 py-0.5 bg-slate-100 text-slate-500 text-[10px] rounded uppercase font-bold tracking-wider">电梯房</span>
<span class="px-2 py-0.5 bg-slate-100 text-slate-500 text-[10px] rounded uppercase font-bold tracking-wider">管家服务</span>
<span class="px-2 py-0.5 bg-green-50 text-green-600 text-[10px] rounded uppercase font-bold tracking-wider">智能门锁</span>
</div>
</div>
<button class="px-4 py-2 border border-slate-200 text-slate-600 rounded-xl text-sm font-medium hover:bg-slate-50">编辑封面</button>
</div>
<!-- 费用单价维护 -->
<div class="grid grid-cols-3 gap-6 pt-8 border-t border-slate-50">
<div class="p-4 bg-blue-50/50 rounded-2xl border border-blue-100">
<div class="flex items-center justify-between mb-3 text-blue-600">
<span class="font-bold">电费单价</span>
<span class="iconify text-2xl" data-icon="solar:bolt-circle-bold"></span>
</div>
<div class="flex items-end gap-1">
<span class="text-2xl font-black text-slate-800">1.20</span>
<span class="text-xs text-slate-400 mb-1">元/度</span>
</div>
<button class="mt-4 text-xs font-bold text-blue-600 bg-white px-3 py-1 rounded-full shadow-sm">修改配置</button>
</div>
<div class="p-4 bg-cyan-50/50 rounded-2xl border border-cyan-100">
<div class="flex items-center justify-between mb-3 text-cyan-600">
<span class="font-bold">水费单价</span>
<span class="iconify text-2xl" data-icon="solar:water-personal-bold"></span>
</div>
<div class="flex items-end gap-1">
<span class="text-2xl font-black text-slate-800">4.50</span>
<span class="text-xs text-slate-400 mb-1">元/吨</span>
</div>
<button class="mt-4 text-xs font-bold text-cyan-600 bg-white px-3 py-1 rounded-full shadow-sm">修改配置</button>
</div>
<div class="p-4 bg-purple-50/50 rounded-2xl border border-purple-100">
<div class="flex items-center justify-between mb-3 text-purple-600">
<span class="font-bold">管理费/月</span>
<span class="iconify text-2xl" data-icon="solar:shield-star-bold"></span>
</div>
<div class="flex items-end gap-1">
<span class="text-2xl font-black text-slate-800">100.00</span>
<span class="text-xs text-slate-400 mb-1">元/户</span>
</div>
<button class="mt-4 text-xs font-bold text-purple-600 bg-white px-3 py-1 rounded-full shadow-sm">修改配置</button>
</div>
</div>
</div>
<!-- 图片库管理 -->
<div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
<div class="flex justify-between items-center mb-6">
<h3 class="text-lg font-bold text-slate-800">公寓相册 (8)</h3>
<button class="text-indigo-600 text-sm font-bold flex items-center gap-1">上传图片 <span class="iconify" data-icon="solar:upload-minimalistic-bold"></span></button>
</div>
<div class="grid grid-cols-4 gap-4">
<img alt="Gallery" class="w-full h-32 rounded-2xl object-cover hover:opacity-80 transition-all cursor-pointer" src="https://modao.cc/agent-py/media/generated_images/2026-03-10/3ecbdd93baee407baa22abd0fb8322fc.jpg"/>
<img alt="Gallery" class="w-full h-32 rounded-2xl object-cover hover:opacity-80 transition-all cursor-pointer" src="https://modao.cc/agent-py/media/generated_images/2026-03-10/3ecbdd93baee407baa22abd0fb8322fc.jpg"/>
<img alt="Gallery" class="w-full h-32 rounded-2xl object-cover hover:opacity-80 transition-all cursor-pointer" src="https://modao.cc/agent-py/media/generated_images/2026-03-10/3ecbdd93baee407baa22abd0fb8322fc.jpg"/>
<img alt="Gallery" class="w-full h-32 rounded-2xl object-cover hover:opacity-80 transition-all cursor-pointer" src="https://modao.cc/agent-py/media/generated_images/2026-03-10/3ecbdd93baee407baa22abd0fb8322fc.jpg"/>
</div>
</div>
<!-- 附加信息表单 -->
<div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm">
<h3 class="text-lg font-bold text-slate-800 mb-6">基础参数维护</h3>
<div class="grid grid-cols-2 gap-6">
<div>
<label class="block text-sm text-slate-500 mb-2">建筑面积</label>
<input class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" type="text" value="3500.22 ㎡"/>
</div>
<div>
<label class="block text-sm text-slate-500 mb-2">落成时间</label>
<input class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" type="date" value="2022-06-15"/>
</div>
<div class="col-span-2">
<label class="block text-sm text-slate-500 mb-2">详细描述</label>
<textarea class="w-full p-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none" rows="3">位于成熟商圈，交通便利。配备指纹锁、地毯、中央空调，全屋精装修，高品质人才公寓首选。</textarea>
</div>
</div>
</div>
</div>
<!-- 右侧：概览与操作 -->
<div class="col-span-4 space-y-6">
<div class="bg-slate-900 rounded-3xl p-8 text-white relative overflow-hidden">
<div class="relative z-10">
<h3 class="text-xl font-bold mb-4">实时状态概览</h3>
<div class="space-y-6">
<div class="flex justify-between items-center">
<span class="text-slate-400">总房间数</span>
<span class="text-2xl font-bold">128</span>
</div>
<div class="flex justify-between items-center text-green-400">
<span class="text-slate-400">当前出租中</span>
<span class="text-2xl font-bold">112</span>
</div>
<div class="flex justify-between items-center text-orange-400">
<span class="text-slate-400">空置待租</span>
<span class="text-2xl font-bold">16</span>
</div>
<div class="w-full bg-slate-800 h-2 rounded-full mt-4">
<div class="bg-indigo-500 h-full w-[87%]" style="width: 87%;"></div>
</div>
<p class="text-[10px] text-center text-slate-500 tracking-widest uppercase">出租率：87.5%</p>
</div>
</div>
<span class="iconify absolute bottom-[-40px] right-[-40px] text-[200px] text-white/5 opacity-20" data-icon="solar:buildings-bold"></span>
</div>
<div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
<h3 class="font-bold text-slate-800 mb-4">快速操作</h3>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center gap-2 p-4 bg-slate-50 rounded-2xl hover:bg-slate-100 transition-all">
<span class="iconify text-2xl text-indigo-600" data-icon="solar:gallery-upload-bold"></span>
<span class="text-xs font-semibold">变更协议</span>
</button>
<button class="flex flex-col items-center gap-2 p-4 bg-slate-50 rounded-2xl hover:bg-slate-100 transition-all">
<span class="iconify text-2xl text-indigo-600" data-icon="solar:user-speak-bold text-green-500"></span>
<span class="text-xs font-semibold">管家设置</span>
</button>
<button class="flex flex-col items-center gap-2 p-4 bg-slate-50 rounded-2xl hover:bg-slate-100 transition-all">
<span class="iconify text-2xl text-indigo-600" data-icon="solar:card-send-bold text-orange-500"></span>
<span class="text-xs font-semibold">收费模版</span>
</button>
<button class="flex flex-col items-center gap-2 p-4 bg-slate-50 rounded-2xl hover:bg-slate-100 transition-all">
<span class="iconify text-2xl text-indigo-600" data-icon="solar:shield-warning-bold text-red-500"></span>
<span class="text-xs font-semibold">解绑组织</span>
</button>
</div>
</div>
<div class="bg-white p-6 rounded-3xl border border-slate-200 border-dashed">
<div class="flex flex-col items-center justify-center py-6 text-slate-400">
<div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mb-3">
<span class="iconify text-2xl" data-icon="solar:clapperboard-edit-bold"></span>
</div>
<p class="text-sm">点击录入新设备关联...</p>
</div>
</div>
</div>
</div>
</main>
</div>
</body>
</html>
