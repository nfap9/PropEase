<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>寓管家 - 工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
        body { background-color: #f1f5f9; }
        .app-container { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow-y: auto; overflow-x: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); border: 8px solid #333; border-radius: 40px; background: #f8fafc; }
        .app-container::-webkit-scrollbar { display: none; }
        .nav-active { color: #2563eb; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
<div class="app-container pb-20">
<!-- Header -->
<div class="bg-gradient-to-br from-blue-700 to-blue-500 pt-12 pb-24 px-6 rounded-b-[45px] shadow-lg">
<div class="flex justify-between items-center mb-6">
<div class="flex items-center space-x-2 text-white bg-white/10 px-3 py-1.5 rounded-full backdrop-blur-md border border-white/20">
<span class="iconify text-xl" data-icon="material-symbols:location-on"></span>
<span class="font-bold text-sm tracking-tight">锦绣花园广场 (管理员)</span>
<span class="iconify" data-icon="material-symbols:swap-horiz-rounded"></span>
</div>
<div class="flex items-center space-x-4">
<div class="relative group cursor-pointer" onclick="toggleNotifications()">
<span class="iconify text-white text-2xl" data-icon="material-symbols:notifications-outline"></span>
<span class="absolute top-0 right-0 w-3 h-3 bg-red-500 border-2 border-blue-600 rounded-full animate-pulse"></span>
</div>
</div>
</div>
<div class="flex flex-col space-y-4">
<div class="flex items-baseline space-x-2 text-white">
<span class="text-4xl font-black">¥ 124,580.00</span>
<span class="text-xs text-white/70 font-medium">3月预估收入</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/10">
<p class="text-white/60 text-[10px] font-bold uppercase tracking-wider">房源周转</p>
<h3 class="text-xl font-black mt-1 text-white">92.4%</h3>
<div class="flex items-center text-[9px] text-green-300 mt-1">
<span class="iconify" data-icon="material-symbols:trending-up"></span>
<span>较上月 +2.3%</span>
</div>
</div>
<div class="bg-white/10 backdrop-blur-md p-4 rounded-3xl border border-white/10">
<p class="text-white/60 text-[10px] font-bold uppercase tracking-wider">空置房间</p>
<h3 class="text-xl font-black mt-1 text-white">12 <small class="text-xs font-normal opacity-70">套</small></h3>
<div class="flex items-center text-[9px] text-blue-100 mt-1">
<span class="iconify" data-icon="material-symbols:info-outline"></span>
<span>待带看房间 5</span>
</div>
</div>
</div>
</div>
</div>
<!-- Float Info Cards -->
<div class="px-5 -mt-10">
<div class="bg-white rounded-3xl p-5 shadow-xl shadow-blue-900/5 grid grid-cols-4 gap-4 border border-gray-50">
<a class="flex flex-col items-center group" href="apartment.html">
<div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 mb-2 group-active:scale-95 transition-transform">
<span class="iconify text-2xl" data-icon="material-symbols:add-home-rounded"></span>
</div>
<span class="text-[10px] font-bold text-gray-500">录房源</span>
</a>
<a class="flex flex-col items-center group" href="lease.html?tab=bill">
<div class="w-12 h-12 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-600 mb-2 group-active:scale-95 transition-transform">
<span class="iconify text-2xl" data-icon="material-symbols:electric-bolt-rounded"></span>
</div>
<span class="text-[10px] font-bold text-gray-500">水电录入</span>
</a>
<a class="flex flex-col items-center group" href="lease.html?tab=create">
<div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 mb-2 group-active:scale-95 transition-transform">
<span class="iconify text-2xl" data-icon="material-symbols:contract-edit-rounded"></span>
</div>
<span class="text-[10px] font-bold text-gray-500">签租约</span>
</a>
<a class="flex flex-col items-center group" href="settings.html">
<div class="w-12 h-12 bg-purple-50 rounded-2xl flex items-center justify-center text-purple-600 mb-2 group-active:scale-95 transition-transform">
<span class="iconify text-2xl" data-icon="material-symbols:group-add-rounded"></span>
</div>
<span class="text-[10px] font-bold text-gray-500">员工邀请</span>
</a>
</div>
</div>
<!-- Date & Calendar Ribbon -->
<div class="px-6 mt-8">
<div class="flex items-center justify-between mb-2">
<div class="flex items-baseline space-x-2">
<span class="text-3xl font-black text-gray-800" id="date-day">10</span>
<span class="text-sm font-bold text-gray-400">2026.03 十二月廿二</span>
</div>
<div class="p-2 bg-gray-100 rounded-xl">
<span class="iconify text-gray-500" data-icon="material-symbols:calendar-month-outline-rounded"></span>
</div>
</div>
<div class="flex space-x-3 overflow-x-auto no-scrollbar py-2">
<div class="min-w-[45px] flex flex-col items-center py-2 bg-blue-600 text-white rounded-2xl shadow-md">
<span class="text-[9px] font-bold opacity-80">周二</span>
<span class="text-sm font-black">10</span>
</div>
<div class="min-w-[45px] flex flex-col items-center py-2 bg-white text-gray-400 rounded-2xl border border-gray-100">
<span class="text-[9px] font-bold">周三</span>
<span class="text-sm font-black text-gray-800">11</span>
</div>
<div class="min-w-[45px] flex flex-col items-center py-2 bg-white text-gray-400 rounded-2xl border border-gray-100">
<span class="text-[9px] font-bold">周四</span>
<span class="text-sm font-black text-gray-800">12</span>
</div>
<div class="min-w-[45px] flex flex-col items-center py-2 bg-white text-gray-400 rounded-2xl border border-gray-100">
<span class="text-[9px] font-bold">周五</span>
<span class="text-sm font-black text-gray-800">13</span>
</div>
<div class="min-w-[45px] flex flex-col items-center py-2 bg-white text-gray-400 rounded-2xl border border-gray-100">
<span class="text-[9px] font-bold">周六</span>
<span class="text-sm font-black text-gray-800">14</span>
</div>
</div>
</div>
<!-- Today's Tasks -->
<div class="px-6 mt-6 pb-24">
<div class="flex justify-between items-center mb-5">
<h2 class="font-black text-xl text-gray-800 tracking-tight">今日待办 <span class="ml-2 text-xs bg-red-100 text-red-500 px-2 py-0.5 rounded-full">3</span></h2>
<span class="text-xs text-blue-600 font-bold">查看全部</span>
</div>
<div class="space-y-4">
<!-- Task Item -->
<div class="bg-white p-5 rounded-[28px] shadow-sm border border-gray-100 relative overflow-hidden group">
<div class="absolute top-0 right-0 w-16 h-16 bg-red-50 -mr-4 -mt-4 rotate-45"></div>
<div class="flex items-start justify-between relative z-10">
<div class="flex space-x-4">
<div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center text-red-600">
<span class="iconify text-2xl" data-icon="material-symbols:warning-rounded"></span>
</div>
<div>
<h4 class="font-bold text-gray-800">逾期催缴 (3条)</h4>
<p class="text-[11px] text-gray-400 mt-1 font-medium">涉及金额 ¥12,400.00</p>
</div>
</div>
<span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
</div>
</div>
<!-- Task Item -->
<div class="bg-white p-5 rounded-[28px] shadow-sm border border-gray-100 group">
<div class="flex items-start justify-between">
<div class="flex space-x-4">
<div class="w-12 h-12 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-600">
<span class="iconify text-2xl" data-icon="material-symbols:history-edu-rounded"></span>
</div>
<div>
<h4 class="font-bold text-gray-800">即将到期 (5个)</h4>
<p class="text-[11px] text-gray-400 mt-1 font-medium">未来 7 天内合同到期</p>
</div>
</div>
<span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
</div>
</div>
<!-- Task Item -->
<div class="bg-white p-5 rounded-[28px] shadow-sm border border-gray-100 group">
<div class="flex items-start justify-between">
<div class="flex space-x-4">
<div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600">
<span class="iconify text-2xl" data-icon="material-symbols:meeting-room-rounded"></span>
</div>
<div>
<h4 class="font-bold text-gray-800">看房预约 (2场)</h4>
<p class="text-[11px] text-gray-400 mt-1 font-medium">14:00 锦绣花园 802</p>
</div>
</div>
<span class="iconify text-gray-300" data-icon="material-symbols:arrow-forward-ios-rounded"></span>
</div>
</div>
</div>
</div>
<!-- Stats Chart -->
<div class="px-4 mt-6">
<div class="bg-white p-4 rounded-2xl shadow-sm">
<h2 class="font-bold text-gray-800 mb-4">收支统计 (2026年3月)</h2>
<div class="w-full h-48" id="incomeChart"></div>
</div>
</div>
<!-- Tabs Navigation -->
<div class="fixed bottom-0 w-[359px] h-16 bg-white border-t border-gray-100 flex items-center justify-around rounded-b-[32px] z-50">
<a class="flex flex-col items-center text-blue-600" href="dashboard.html">
<span class="iconify text-xl" data-icon="material-symbols:dashboard-rounded"></span>
<span class="text-[10px] mt-0.5">工作台</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="apartment.html">
<span class="iconify text-xl" data-icon="material-symbols:home-work-outline"></span>
<span class="text-[10px] mt-0.5">房源</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="lease.html">
<span class="iconify text-xl" data-icon="material-symbols:receipt-long-outline"></span>
<span class="text-[10px] mt-0.5">租务</span>
</a>
<a class="flex flex-col items-center text-gray-400" href="settings.html">
<span class="iconify text-xl" data-icon="material-symbols:manage-accounts-outline"></span>
<span class="text-[10px] mt-0.5">设置</span>
</a>
</div>
</div>
<script>
        window.onload = function() {
            var chartDom = document.getElementById('incomeChart');
            var myChart = echarts.init(chartDom);
            var option = {
                grid: { left: '3%', right: '4%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: { type: 'category', data: ['Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar'], axisLine: { show: false }, axisTick: { show: false } },
                yAxis: { type: 'value', axisLine: { show: false }, splitLine: { lineStyle: { type: 'dashed' } } },
                series: [
                    {
                        data: [12000, 15000, 14500, 18000, 17500, 19200],
                        type: 'line',
                        smooth: true,
                        color: '#2563eb',
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(37,99,235,0.2)' },
                                { offset: 1, color: 'rgba(37,99,235,0)' }
                            ])
                        }
                    }
                ]
            };
            myChart.setOption(option);
        };
    </script>
</body>
</html>
