name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # 变更检测
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      tenant_web: ${{ steps.filter.outputs.tenant_web }}
      admin_web: ${{ steps.filter.outputs.admin_web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/api-contract/**'
              - 'pnpm-lock.yaml'
            tenant_web:
              - 'tenant-web/**'
              - 'packages/api-contract/**'
              - 'pnpm-lock.yaml'
            admin_web:
              - 'admin-web/**'
              - 'packages/api-contract/**'
              - 'pnpm-lock.yaml'
            mobile:
              - 'mobile/**'
              - 'packages/api-contract/**'
              - 'pnpm-lock.yaml'
            docker:
              - 'docker/**'
              - '**/Dockerfile*'

  # 后端（api）：lint、类型检查与测试
  api:
    name: api
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Restore api-contract build
        id: contract-cache
        uses: actions/cache@v4
        with:
          path: packages/api-contract/dist
          key: contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/api-contract/**') }}
          restore-keys: |
            contract-${{ runner.os }}-

      - name: Build api-contract
        if: steps.contract-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @apartment-ultra/api-contract run build

      - name: Prisma generate
        run: pnpm --filter apartment-ultra-api exec prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run ESLint
        run: pnpm --filter apartment-ultra-api run lint

      - name: Type check
        run: pnpm --filter apartment-ultra-api run type-check

      - name: Prisma db push
        run: pnpm --filter apartment-ultra-api exec prisma db push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # 租客端 Web：lint、类型检查、测试与构建
  tenant-web:
    name: tenant-web
    needs: [changes]
    if: needs.changes.outputs.tenant_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Restore api-contract build
        id: contract-cache
        uses: actions/cache@v4
        with:
          path: packages/api-contract/dist
          key: contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/api-contract/**') }}
          restore-keys: |
            contract-${{ runner.os }}-

      - name: Build api-contract
        if: steps.contract-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @apartment-ultra/api-contract run build

      - name: Run ESLint
        run: pnpm --filter apartment-ultra-tenant run lint

      - name: Type check
        run: pnpm --filter apartment-ultra-tenant run type-check

      - name: Build
        run: pnpm --filter apartment-ultra-tenant run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  # 运营后台：lint、类型检查、测试与构建
  admin-web:
    name: admin-web
    needs: [changes]
    if: needs.changes.outputs.admin_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Restore api-contract build
        id: contract-cache-admin
        uses: actions/cache@v4
        with:
          path: packages/api-contract/dist
          key: contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/api-contract/**') }}
          restore-keys: |
            contract-${{ runner.os }}-

      - name: Build api-contract
        if: steps.contract-cache-admin.outputs.cache-hit != 'true'
        run: pnpm --filter @apartment-ultra/api-contract run build

      - name: Run ESLint
        run: pnpm --filter apartment-ultra-admin run lint

      - name: Type check
        run: pnpm --filter apartment-ultra-admin run type-check

      - name: Build
        run: pnpm --filter apartment-ultra-admin run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1

  # 移动端（mobile）：当前按实验性包单独治理，只接入最小 type-check
  mobile:
    name: mobile
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Restore api-contract build
        id: contract-cache-mobile
        uses: actions/cache@v4
        with:
          path: packages/api-contract/dist
          key: contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/api-contract/**') }}
          restore-keys: |
            contract-${{ runner.os }}-

      - name: Build api-contract
        if: steps.contract-cache-mobile.outputs.cache-hit != 'true'
        run: pnpm --filter @apartment-ultra/api-contract run build

      - name: Type check
        run: pnpm --filter mobile run type-check

  # Docker 构建验证并推送到 GHCR（仅 push 到 main 时运行）
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [changes, api, tenant-web, admin-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-api:main
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-api:${{ github.sha }}

      - name: Build and push tenant-web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tenant-web/Dockerfile
          push: true
          build-args: VITE_API_URL=http://localhost/api/v1
          tags: |
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-tenant-web:main
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-tenant-web:${{ github.sha }}

      - name: Build and push admin-web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: admin-web/Dockerfile
          push: true
          build-args: VITE_API_URL=http://localhost/api/v1
          tags: |
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-admin-web:main
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-admin-web:${{ github.sha }}
