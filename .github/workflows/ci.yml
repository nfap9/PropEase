name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # 变更检测
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/api-contract/**'
              - 'pnpm-lock.yaml'
            web:
              - 'tenant-web/**'
              - 'admin-web/**'
              - 'packages/api-contract/**'
              - 'pnpm-lock.yaml'
            docker:
              - 'docker/**'
              - '**/Dockerfile*'

  # 后端（api）：lint、类型检查与测试
  api:
    name: api
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Restore api-contract build
        id: contract-cache
        uses: actions/cache@v4
        with:
          path: packages/api-contract/dist
          key: contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/api-contract/**') }}
          restore-keys: |
            contract-${{ runner.os }}-

      - name: Build api-contract
        if: steps.contract-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @apartment-ultra/api-contract run build

      - name: Prisma generate
        run: pnpm --filter apartment-ultra-api exec prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run ESLint
        run: pnpm --filter apartment-ultra-api run lint

      - name: Type check
        run: pnpm --filter apartment-ultra-api run type-check

      - name: Prisma db push
        run: pnpm --filter apartment-ultra-api exec prisma db push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Test
        run: pnpm --filter apartment-ultra-api run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  # 前端构建检查
  frontend:
    name: Frontend
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Restore api-contract build
        id: contract-cache
        uses: actions/cache@v4
        with:
          path: packages/api-contract/dist
          key: contract-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/api-contract/**') }}
          restore-keys: |
            contract-${{ runner.os }}-

      - name: Build api-contract
        if: steps.contract-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @apartment-ultra/api-contract run build

      - name: Run ESLint
        run: pnpm --filter frontend run lint

      - name: Type check
        run: pnpm --filter frontend run type-check

      - name: Run tests
        run: pnpm --filter frontend run test:run

      - name: Build
        run: pnpm --filter frontend run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  # Docker 构建验证并推送到 GHCR（仅 push 到 main 时运行）
  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: [changes, api, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-api:main
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-api:${{ github.sha }}

      - name: Build and push tenant-web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tenant-web/Dockerfile.prod
          push: true
          build-args: NEXT_PUBLIC_API_URL=http://localhost/api/v1
          tags: |
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-tenant-web:main
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-tenant-web:${{ github.sha }}

      - name: Build and push admin-web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: admin-web/Dockerfile.prod
          push: true
          build-args: NEXT_PUBLIC_API_URL=http://localhost/api/v1
          tags: |
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-admin-web:main
            ghcr.io/${{ github.repository_owner }}/apartment-ultra-admin-web:${{ github.sha }}
