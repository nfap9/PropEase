# 可观测性服务 - Jaeger All-in-One
# 使用方式: docker compose -f docker/docker-compose.yaml -f docker/docker-compose.observability.yaml --env-file .env.production up -d

services:
  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: apartment_ultra_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      # Jaeger UI
      - "${JAEGER_UI_PORT:-16686}:16686"
      # OTLP gRPC (OpenTelemetry)
      - "${OTLP_GRPC_PORT:-4317}:4317"
      # OTLP HTTP
      - "${OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    networks:
      - apartment-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  apartment-network:
    external: true
