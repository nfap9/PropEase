# 可观测性服务 - Jaeger All-in-One
# 使用方式: docker compose -f docker-compose.middleware.yaml -f docker-compose.observability.yaml up -d

services:
  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: apartment-ultra-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      # Jaeger UI
      - "16686:16686"
      # OTLP gRPC (OpenTelemetry)
      - "4317:4317"
      # OTLP HTTP
      - "4318:4318"
    restart: unless-stopped
