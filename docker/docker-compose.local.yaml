# =========================================
# Apartment Ultra 本地完整 Docker 部署
# =========================================
# 使用方法:
#   docker compose -f docker/docker-compose.local.yaml --env-file docker/.env.docker up -d
# =========================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: apartment_ultra_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-apartment_ultra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apartment-network

  redis:
    image: redis:7-alpine
    container_name: apartment_ultra_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apartment-network

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: apartment_ultra_api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-apartment_ultra}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:80","http://localhost:3000"]}
      DEBUG: "false"
      APP_NAME: ${APP_NAME:-Apartment Ultra API}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-Admin@123456}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apartment-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tenant-web:
    build:
      context: ..
      dockerfile: tenant-web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    container_name: apartment_ultra_tenant_web
    environment:
      NODE_ENV: production
      API_URL_SERVER: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apartment-network

  admin-web:
    build:
      context: ..
      dockerfile: admin-web/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
    container_name: apartment_ultra_admin_web
    environment:
      NODE_ENV: production
      API_URL_SERVER: http://api:8000/api/v1
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apartment-network

  nginx:
    image: nginx:alpine
    container_name: apartment_ultra_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf.local.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - SERVER_NAME=localhost
    depends_on:
      - api
      - tenant-web
      - admin-web
    restart: unless-stopped
    networks:
      - apartment-network

volumes:
  postgres_data:
  redis_data:

networks:
  apartment-network:
    driver: bridge
