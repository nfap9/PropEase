# 本地开发 Docker Compose 配置
# 使用方法:
#   cd docker && docker compose -f docker-compose.dev.yaml up -d
#
# 仅部署 API 服务，连接到已有的中间件（通过 docker-compose.middleware.yaml 启动）

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.dev
    container_name: apartment_ultra_api_dev
    environment:
      NODE_ENV: development
      IS_DEV: "true"
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5432/apartment_ultra
      SECRET_KEY: dev-secret-key-for-local-development-only
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]'
      DEBUG: "true"
      APP_NAME: Apartment Ultra API (Dev)
      ADMIN_INIT_PASSWORD: Admin@123
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      # 微信支付配置（开发环境禁用）
      WECHAT_PAY_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      # 挂载源码支持热重载
      - ../api/src:/app/api/src:ro
      - ../api/prisma:/app/api/prisma:ro
      - ../packages:/app/packages:ro
    extra_hosts:
      # 允许容器访问宿主机的服务（如 postgres）
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - apartment-dev-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  apartment-dev-network:
    driver: bridge
