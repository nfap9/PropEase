# Production docker-compose configuration（后端为 api）
# ==================================================================

x-shared-env: &shared-api-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/apartment_ultra
  SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
  CORS_ORIGINS: '["http://localhost:3000"]'
  DEBUG: ${DEBUG:-false}

services:
  postgres:
    image: postgres:15-alpine
    container_name: apartment_ultra_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apartment_ultra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: apartment_ultra_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: apartment-ultra_api
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: apartment_ultra_api
    environment:
      <<: *shared-api-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: apartment-ultra_web
    build:
      context: ..
      dockerfile: web/Dockerfile
    container_name: apartment_ultra_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
