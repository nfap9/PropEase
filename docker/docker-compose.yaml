# PropEase Docker Compose 配置
# ==================================================================
# 使用方法:
#   完整部署:
#     docker compose -f docker/docker-compose.yaml --env-file .env.production up -d
#
#   本地完整部署（测试用）:
#     docker compose -f docker/docker-compose.yaml --env-file docker/.env.docker up -d
#
#   可观测性服务（叠加使用）:
#     docker compose -f docker/docker-compose.yaml -f docker/docker-compose.observability.yaml --env-file docker/.env.docker up -d
# ==================================================================

name: propease

services:
  postgres:
    image: postgres:15-alpine
    container_name: propease_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-apartment_ultra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apartment-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY:-1G}

  # 数据库初始化服务（执行迁移，仅首次启动或变更时需要）
  db_setup:
    image: propease-api:${API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: propease_db_setup
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && echo 'Migration completed'"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apartment_ultra}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - apartment-network

  redis:
    image: redis:7-alpine
    container_name: propease_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apartment-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: propease-api:${API_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: propease_api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apartment_ultra}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      DEBUG: "false"
      APP_NAME: ${APP_NAME:-PropEase API}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # 微信支付配置（可选）
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APIV3_KEY: ${WECHAT_APIV3_KEY:-}
      WECHAT_CERT_SERIAL_NO: ${WECHAT_CERT_SERIAL_NO:-}
      WECHAT_PAY_NOTIFY_URL_BASE: ${WECHAT_PAY_NOTIFY_URL_BASE:-}
      WECHAT_PRIVATE_KEY: ${WECHAT_PRIVATE_KEY:-}
    depends_on:
      db_setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apartment-network
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-1G}

  # 前端构建容器（租户端）- 构建完成后退出
  tenant-web:
    image: propease-web:${WEB_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    container_name: propease_tenant_web
    volumes:
      - web_static:/usr/share/nginx/html
    # 构建产物写入卷后立即退出
    entrypoint: ["sh", "-c", "cp -r /usr/share/nginx/html/tenant/* /usr/share/nginx/html/tenant/ && exit 0"]
    restart: "no"
    networks:
      - apartment-network
    depends_on:
      api:
        condition: service_healthy

  # 前端构建容器（管理后台）- 构建完成后退出
  admin-web:
    image: propease-web:${WEB_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    container_name: propease_admin_web
    volumes:
      - web_static:/usr/share/nginx/html
    # 构建产物写入卷后立即退出
    entrypoint: ["sh", "-c", "cp -r /usr/share/nginx/html/admin/* /usr/share/nginx/html/admin/ && exit 0"]
    restart: "no"
    networks:
      - apartment-network
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: propease_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - web_static:/usr/share/nginx/html:ro
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    depends_on:
      tenant-web:
        condition: service_started
      admin-web:
        condition: service_started
    restart: unless-stopped
    networks:
      - apartment-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  web_static:

networks:
  apartment-network:
    driver: bridge
